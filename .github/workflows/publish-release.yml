name: Publish verified release assets

on:
  push:
    branches: [release/publish-v3.2.0]
    paths: [release/publish-request.json]

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-v3.2.0
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Shixiaoshi0417/NekoKEM'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Validate exact source, passing runs and recovered signing key
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/publish_release.py
