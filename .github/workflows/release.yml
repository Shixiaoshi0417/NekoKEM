name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NEKOKEM_BUILD_TESTS: "0"

jobs:
  build-linux:
    name: Build Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential ca-certificates curl perl

      - name: Build, verify, and package
        run: bash linux/scripts/build-linux-release.sh "${{ matrix.arch }}" "$GITHUB_WORKSPACE/dist"

      - name: Upload Linux archive
        uses: actions/upload-artifact@v4
        with:
          name: NekoKEM-linux-${{ matrix.arch }}
          path: dist/NekoKEM-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  signed-apk:
    environment: NekoKEM
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install pinned Android toolchain
        run: |
          set -Eeuo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager_path=$(find "$sdk_root/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)
          test -n "$sdkmanager_path"
          "$sdkmanager_path" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
          printf 'ANDROID_SDK_ROOT=%s\nANDROID_NDK_ROOT=%s/ndk/28.2.13676358\n' "$sdk_root" "$sdk_root" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare protected release signing
        env:
          ROTATE_SIGNING: "false"
          NEKOKEM_RELEASE_KEYSTORE_BASE64: ${{ secrets.NEKOKEM_RELEASE_KEYSTORE_BASE64 }}
          NEKOKEM_RELEASE_STORE_PASSWORD: ${{ secrets.NEKOKEM_RELEASE_STORE_PASSWORD }}
          NEKOKEM_RELEASE_KEY_ALIAS: ${{ secrets.NEKOKEM_RELEASE_KEY_ALIAS }}
          NEKOKEM_RELEASE_KEY_PASSWORD: ${{ secrets.NEKOKEM_RELEASE_KEY_PASSWORD }}
        run: python3 .github/scripts/prepare_release_signing.py
      - name: Build OpenSSL 4.0.3 for Android arm64
        working-directory: android
        env:
          JOBS: "2"
        run: sh scripts/build-openssl-android.sh
      - name: Build signed APK
        working-directory: android
        run: bash ./gradlew --no-daemon --stacktrace assembleRelease
      - name: Verify APK and encrypt signing recovery
        run: python3 .github/scripts/verify_android_release.py
      - name: Preserve signed APK and encrypted recovery only
        uses: actions/upload-artifact@v4
        with:
          name: NekoKEM-android-signed
          path: release-output/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Remove plaintext signing material
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/nekokem-release-signing"

  build-windows:
    name: Build Windows CLI and GUI
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable-x86_64-pc-windows-gnu
          targets: x86_64-pc-windows-gnu
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make perl curl tar
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python
      - name: Identify native compiler
        id: compiler
        shell: msys2 {0}
        run: |
          echo "version=$(gcc -dumpfullversion)" >> "$GITHUB_OUTPUT"
          echo "gcc=$(cygpath -m "$(command -v gcc)")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: openssl-cache
        with:
          path: ${{ runner.temp }}/windows-openssl
          key: windows-ucrt64-openssl-4.0.3-${{ steps.compiler.outputs.version }}-${{ hashFiles('windows/scripts/build-windows-cli.sh') }}
          restore-keys: windows-ucrt64-openssl-4.0.3-${{ steps.compiler.outputs.version }}-
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          cache-on-failure: true
      - name: Build Windows CLI with pinned OpenSSL
        shell: msys2 {0}
        run: |
          export NEKOKEM_OPENSSL_PREFIX="$(cygpath -u "$RUNNER_TEMP")/windows-openssl"
          bash windows/scripts/build-windows-cli.sh "$(cygpath -u "$RUNNER_TEMP")/windows-cli"
      - uses: actions/cache/save@v4
        if: steps.openssl-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/windows-openssl
          key: ${{ steps.openssl-cache.outputs.cache-primary-key }}
      - name: Configure the matching Rust/C ABI
        shell: pwsh
        run: |
          $compiler = '${{ steps.compiler.outputs.gcc }}'
          if (!(Test-Path -LiteralPath $compiler)) { throw "GCC not found: $compiler" }
          & $compiler --version
          if ($LASTEXITCODE -ne 0) { throw 'Cannot execute GCC' }
          $bin = Split-Path $compiler
          "NEKOKEM_NATIVE_BIN=$bin" >> $env:GITHUB_ENV
          $bin >> $env:GITHUB_PATH
          "RC_x86_64_pc_windows_gnu=$bin/windres.exe" >> $env:GITHUB_ENV
          "CC_x86_64_pc_windows_gnu=$compiler" >> $env:GITHUB_ENV
          "CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=$compiler" >> $env:GITHUB_ENV
          "NEKOKEM_OPENSSL_PREFIX=$env:RUNNER_TEMP\windows-openssl" >> $env:GITHUB_ENV
          $work = Join-Path ([Environment]::GetFolderPath('LocalApplicationData')) "NekoKEM-release-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory $work | Out-Null
          "TEMP=$work" >> $env:GITHUB_ENV
          "TMP=$work" >> $env:GITHUB_ENV
      - name: Install locked frontend dependencies
        working-directory: desktop
        shell: pwsh
        run: |
          npm ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Frontend build failed' }
      - name: Build production native GUI EXE
        working-directory: desktop
        shell: pwsh
        run: |
          npm run tauri -- build --target x86_64-pc-windows-gnu --no-bundle -- --locked
          if ($LASTEXITCODE -ne 0) { throw 'GUI build failed' }
      - name: Verify GUI binary, SDK loader and icon
        shell: pwsh
        run: |
          $exe = 'desktop/src-tauri/target/x86_64-pc-windows-gnu/release/nekokem-gui.exe'
          & (Join-Path $env:NEKOKEM_NATIVE_BIN 'objdump.exe') -p $exe | Out-File -Encoding utf8 gui-pe.txt
          $loader = Join-Path (Split-Path $exe) 'WebView2Loader.dll'
          $sdk = @(Get-ChildItem "$env:CARGO_HOME/registry/src/*/webview2-com-sys-0.39.1/x64/WebView2Loader.dll")
          if ($sdk.Count -ne 1) { throw 'Locked WebView2 SDK loader reference missing or ambiguous' }
          & '${{ steps.python.outputs.python-path }}' desktop/tests/check_gui_pe.py $exe gui-pe.txt $sdk[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'GUI PE check failed' }
          $signature = Get-AuthenticodeSignature $loader
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft Corporation') { throw 'WebView2 SDK loader Microsoft signature verification failed' }
          @{ sha256=(Get-FileHash $loader -Algorithm SHA256).Hash.ToLowerInvariant(); version='webview2-com-sys 0.39.1'; signature_status=[string]$signature.Status; signer=$signature.SignerCertificate.Subject } | ConvertTo-Json | Set-Content webview2-loader-metadata.json
          & '${{ steps.python.outputs.python-path }}' desktop/tests/check_icon.py $exe windows/icons/icon.ico
          if ($LASTEXITCODE -ne 0) { throw 'GUI icon differs from Android' }
      - name: Package unsigned Windows CLI
        shell: pwsh
        run: |
          $bin = Join-Path $env:RUNNER_TEMP 'windows-cli'
          Compress-Archive -Path "$bin/nekokem.exe","$bin/README.md","$bin/SECURITY-DESIGN.md","$bin/LICENSE","$bin/OPENSSL-LICENSE.txt","$bin/SHA256SUMS.txt","$bin/pe-headers.txt","$bin/build-metadata.json" -DestinationPath "$env:RUNNER_TEMP/NekoKEM-windows-x86_64.zip"
          (Get-FileHash "$env:RUNNER_TEMP/NekoKEM-windows-x86_64.zip" -Algorithm SHA256).Hash.ToLower() + '  NekoKEM-windows-x86_64.zip' | Set-Content "$env:RUNNER_TEMP/windows-SHA256SUMS.txt" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: NekoKEM-windows-x86_64
          path: |
            ${{ runner.temp }}/NekoKEM-windows-x86_64.zip
            ${{ runner.temp }}/windows-SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: error
      - name: Package unsigned GUI with source metadata
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'NekoKEM-Windows-GUI'
          New-Item -ItemType Directory $root | Out-Null
          Copy-Item desktop/src-tauri/target/x86_64-pc-windows-gnu/release/nekokem-gui.exe,desktop/src-tauri/target/x86_64-pc-windows-gnu/release/WebView2Loader.dll,webview2-loader-metadata.json $root
          Copy-Item desktop/README.md,windows/SECURITY-DESIGN.md,LICENSE,gui-pe.txt,desktop/package-lock.json,desktop/src-tauri/Cargo.lock $root
          Copy-Item (Join-Path $env:RUNNER_TEMP 'windows-cli/OPENSSL-LICENSE.txt') $root
          $hash = (Get-FileHash "$root/nekokem-gui.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          $loaderHash = (Get-FileHash "$root/WebView2Loader.dll" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  nekokem-gui.exe","$loaderHash  WebView2Loader.dll" | Set-Content "$root/SHA256SUMS.txt"
          @{ source_sha=$env:GITHUB_SHA; run_id=$env:GITHUB_RUN_ID; exe_sha256=$hash; platform='windows-x86_64'; openssl_version='4.0.3'; authenticode_signed=$false; apk_signing_material_used=$false } | ConvertTo-Json | Set-Content "$root/build-metadata.json"
          Compress-Archive -Path "$root/*" -DestinationPath "$env:RUNNER_TEMP/NekoKEM-Windows-GUI.zip"
          Remove-Item $env:TEMP -Recurse -Force
      - uses: actions/upload-artifact@v4
        with:
          name: NekoKEM-windows-gui-x86_64
          path: ${{ runner.temp }}/NekoKEM-Windows-GUI.zip
          retention-days: 14
          if-no-files-found: error
