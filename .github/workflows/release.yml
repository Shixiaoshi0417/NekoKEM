name: Release

# Runs only by hand. Every job builds from scratch: no Actions cache is read or
# written, so nothing a CI run stored can reach a release package. The APK is
# built without signing material and signed in a separate job that runs no
# build code; only that job uses the NekoKEM Environment, and only on main.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NEKOKEM_BUILD_TESTS: "0"

jobs:
  build-linux:
    name: Build Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential ca-certificates curl perl

      - name: Build, verify, and package
        run: bash linux/scripts/build-linux-release.sh "${{ matrix.arch }}" "$GITHUB_WORKSPACE/dist"

      - name: Upload Linux archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NekoKEM-linux-${{ matrix.arch }}
          path: dist/NekoKEM-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  build-apk:
    name: Build unsigned Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      apk_sha256: ${{ steps.unsigned.outputs.sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install pinned Android toolchain
        run: |
          set -Eeuo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager_path=$(find "$sdk_root/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)
          test -n "$sdkmanager_path"
          "$sdkmanager_path" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
          printf 'ANDROID_SDK_ROOT=%s\nANDROID_NDK_ROOT=%s/ndk/28.2.13676358\n' "$sdk_root" "$sdk_root" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-disabled: true
      - name: Build OpenSSL 4.0.3 for Android arm64
        working-directory: android
        env:
          JOBS: "2"
        run: sh scripts/build-openssl-android.sh
      - name: Build unsigned release APK
        working-directory: android
        run: bash ./gradlew --no-daemon --stacktrace -PnekokemUnsignedRelease=true assembleRelease
      # Any job of this run can replace a named artifact; signed-apk signs only these bytes.
      - name: Record the unsigned APK digest
        id: unsigned
        run: |
          set -Eeuo pipefail
          digest=$(sha256sum android/app/build/outputs/apk/release/app-release-unsigned.apk | cut -d ' ' -f 1)
          printf 'sha256=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NekoKEM-android-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          compression-level: 0
          # The signing job may wait for Environment approval.
          retention-days: 14

  signed-apk:
    name: Sign Android APK
    needs: build-apk
    if: github.ref == 'refs/heads/main'
    environment: NekoKEM
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Signing and verification must agree; rotation is a deliberate edit here.
      ROTATE_SIGNING: "false"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install pinned Android build tools
        run: |
          set -Eeuo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager_path=$(find "$sdk_root/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)
          test -n "$sdkmanager_path"
          "$sdkmanager_path" "build-tools;35.0.0"
          printf 'ANDROID_SDK_ROOT=%s\n' "$sdk_root" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: NekoKEM-android-unsigned
          path: ${{ runner.temp }}/unsigned
      - name: Check the unsigned APK is the one build-apk produced
        env:
          EXPECTED_SHA256: ${{ needs.build-apk.outputs.apk_sha256 }}
        run: |
          set -Eeuo pipefail
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$EXPECTED_SHA256" "$RUNNER_TEMP/unsigned/app-release-unsigned.apk" | sha256sum -c -
      # The secrets exist only in this step: no GITHUB_ENV, no build tools,
      # and none of the tools that verify the result.
      - name: Sign the APK
        env:
          NEKOKEM_RELEASE_KEYSTORE_BASE64: ${{ secrets.NEKOKEM_RELEASE_KEYSTORE_BASE64 }}
          NEKOKEM_RELEASE_STORE_PASSWORD: ${{ secrets.NEKOKEM_RELEASE_STORE_PASSWORD }}
          NEKOKEM_RELEASE_KEY_ALIAS: ${{ secrets.NEKOKEM_RELEASE_KEY_ALIAS }}
          NEKOKEM_RELEASE_KEY_PASSWORD: ${{ secrets.NEKOKEM_RELEASE_KEY_PASSWORD }}
        run: python3 .github/scripts/sign_android_release.py sign "$RUNNER_TEMP/unsigned/app-release-unsigned.apk" release-output
      - name: Remove plaintext signing material
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/nekokem-release-signing"
      - name: Verify and describe the signed APK
        run: python3 .github/scripts/sign_android_release.py verify "$RUNNER_TEMP/unsigned/app-release-unsigned.apk" release-output
      - name: Preserve the signed APK and its metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NekoKEM-android-signed
          path: release-output/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  build-windows:
    name: Build Windows CLI and GUI
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        id: python
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable-x86_64-pc-windows-gnu
          targets: x86_64-pc-windows-gnu
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          cache: false
          update: true
          install: >-
            make perl curl tar
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python
      - name: Identify native compiler
        id: compiler
        shell: msys2 {0}
        run: |
          echo "version=$(gcc -dumpfullversion)" >> "$GITHUB_OUTPUT"
          echo "gcc=$(cygpath -m "$(command -v gcc)")" >> "$GITHUB_OUTPUT"
      - name: Build Windows CLI with pinned OpenSSL
        shell: msys2 {0}
        run: |
          export NEKOKEM_OPENSSL_PREFIX="$(cygpath -u "$RUNNER_TEMP")/windows-openssl"
          bash windows/scripts/build-windows-cli.sh "$(cygpath -u "$RUNNER_TEMP")/windows-cli"
      - name: Configure the matching Rust/C ABI
        shell: pwsh
        run: |
          $compiler = '${{ steps.compiler.outputs.gcc }}'
          if (!(Test-Path -LiteralPath $compiler)) { throw "GCC not found: $compiler" }
          & $compiler --version
          if ($LASTEXITCODE -ne 0) { throw 'Cannot execute GCC' }
          $bin = Split-Path $compiler
          "NEKOKEM_NATIVE_BIN=$bin" >> $env:GITHUB_ENV
          $bin >> $env:GITHUB_PATH
          "RC_x86_64_pc_windows_gnu=$bin/windres.exe" >> $env:GITHUB_ENV
          "CC_x86_64_pc_windows_gnu=$compiler" >> $env:GITHUB_ENV
          "CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=$compiler" >> $env:GITHUB_ENV
          "NEKOKEM_OPENSSL_PREFIX=$env:RUNNER_TEMP\windows-openssl" >> $env:GITHUB_ENV
          $work = Join-Path ([Environment]::GetFolderPath('LocalApplicationData')) "NekoKEM-release-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory $work | Out-Null
          "TEMP=$work" >> $env:GITHUB_ENV
          "TMP=$work" >> $env:GITHUB_ENV
      - name: Install locked frontend dependencies
        working-directory: desktop
        shell: pwsh
        run: |
          npm ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Frontend build failed' }
      - name: Build production native GUI EXE
        working-directory: desktop
        shell: pwsh
        run: |
          npm run tauri -- build --target x86_64-pc-windows-gnu --no-bundle -- --locked
          if ($LASTEXITCODE -ne 0) { throw 'GUI build failed' }
      - name: Verify GUI binary, SDK loader and icon
        shell: pwsh
        run: |
          $exe = 'desktop/src-tauri/target/x86_64-pc-windows-gnu/release/nekokem-gui.exe'
          & (Join-Path $env:NEKOKEM_NATIVE_BIN 'objdump.exe') -p $exe | Out-File -Encoding utf8 gui-pe.txt
          $loader = Join-Path (Split-Path $exe) 'WebView2Loader.dll'
          $sdk = @(Get-ChildItem "$env:CARGO_HOME/registry/src/*/webview2-com-sys-0.39.1/x64/WebView2Loader.dll")
          if ($sdk.Count -ne 1) { throw 'Locked WebView2 SDK loader reference missing or ambiguous' }
          & '${{ steps.python.outputs.python-path }}' desktop/tests/check_gui_pe.py $exe gui-pe.txt $sdk[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'GUI PE check failed' }
          $signature = Get-AuthenticodeSignature $loader
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft Corporation') { throw 'WebView2 SDK loader Microsoft signature verification failed' }
          @{ sha256=(Get-FileHash $loader -Algorithm SHA256).Hash.ToLowerInvariant(); version='webview2-com-sys 0.39.1'; signature_status=[string]$signature.Status; signer=$signature.SignerCertificate.Subject } | ConvertTo-Json | Set-Content webview2-loader-metadata.json
          & '${{ steps.python.outputs.python-path }}' desktop/tests/check_icon.py $exe windows/icons/icon.ico
          if ($LASTEXITCODE -ne 0) { throw 'GUI icon differs from the shared Windows ICO' }
      - name: Package unsigned Windows CLI
        shell: pwsh
        run: |
          $bin = Join-Path $env:RUNNER_TEMP 'windows-cli'
          Compress-Archive -Path "$bin/nekokem.exe","$bin/README.md","$bin/SECURITY-DESIGN.md","$bin/LICENSE","$bin/OPENSSL-LICENSE.txt","$bin/SHA256SUMS.txt","$bin/pe-headers.txt","$bin/build-metadata.json" -DestinationPath "$env:RUNNER_TEMP/NekoKEM-windows-x86_64.zip"
          (Get-FileHash "$env:RUNNER_TEMP/NekoKEM-windows-x86_64.zip" -Algorithm SHA256).Hash.ToLower() + '  NekoKEM-windows-x86_64.zip' | Set-Content "$env:RUNNER_TEMP/windows-SHA256SUMS.txt" -Encoding ascii
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NekoKEM-windows-x86_64
          path: |
            ${{ runner.temp }}/NekoKEM-windows-x86_64.zip
            ${{ runner.temp }}/windows-SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: error
      - name: Package unsigned GUI with source metadata
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'NekoKEM-Windows-GUI'
          New-Item -ItemType Directory $root | Out-Null
          Copy-Item desktop/src-tauri/target/x86_64-pc-windows-gnu/release/nekokem-gui.exe,desktop/src-tauri/target/x86_64-pc-windows-gnu/release/WebView2Loader.dll,webview2-loader-metadata.json $root
          Copy-Item desktop/README.md,windows/SECURITY-DESIGN.md,LICENSE,gui-pe.txt,desktop/package-lock.json,desktop/src-tauri/Cargo.lock $root
          Copy-Item (Join-Path $env:RUNNER_TEMP 'windows-cli/OPENSSL-LICENSE.txt') $root
          $hash = (Get-FileHash "$root/nekokem-gui.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          $loaderHash = (Get-FileHash "$root/WebView2Loader.dll" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  nekokem-gui.exe","$loaderHash  WebView2Loader.dll" | Set-Content "$root/SHA256SUMS.txt"
          $version = (Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          @{ source_sha=$env:GITHUB_SHA; run_id=$env:GITHUB_RUN_ID; version=$version; exe_sha256=$hash; platform='windows-x86_64'; openssl_version='4.0.3'; authenticode_signed=$false; apk_signing_material_used=$false } | ConvertTo-Json | Set-Content "$root/build-metadata.json"
          Compress-Archive -Path "$root/*" -DestinationPath "$env:RUNNER_TEMP/NekoKEM-Windows-GUI.zip"
          Remove-Item $env:TEMP -Recurse -Force
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NekoKEM-windows-gui-x86_64
          path: ${{ runner.temp }}/NekoKEM-Windows-GUI.zip
          retention-days: 14
          if-no-files-found: error

  build-macos:
    name: Build Apple Silicon CLI and GUI
    runs-on: macos-15
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
          targets: aarch64-apple-darwin
      - name: Check the native architecture and set the OpenSSL prefix
        run: |
          set -Eeuo pipefail
          test "$(uname -m)" = arm64
          echo "NEKOKEM_OPENSSL_PREFIX=$RUNNER_TEMP/macos-openssl" >> "$GITHUB_ENV"
      - name: Build and verify native arm64 CLI package
        run: bash macos/scripts/build-macos-cli.sh "$RUNNER_TEMP/macos-cli"
      - name: Install locked frontend dependencies
        working-directory: desktop
        run: npm ci --ignore-scripts
      - name: Build ad-hoc signed arm64 application and DMG
        working-directory: desktop
        run: npm run tauri -- build --target aarch64-apple-darwin --config src-tauri/tauri.macos.conf.json --bundles app,dmg -- --locked
      - name: Validate application and disk image, then package the GUI
        run: |
          python3 desktop/scripts/package-macos-gui.py \
            --bundle-dir desktop/src-tauri/target/aarch64-apple-darwin/release/bundle \
            --output "$RUNNER_TEMP/macos-gui" --version 4.1.0 --source-sha "$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NekoKEM-macos-arm64
          path: |
            ${{ runner.temp }}/macos-cli/NekoKEM-macos-arm64.tar.gz
            ${{ runner.temp }}/macos-cli/macos-SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NekoKEM-macos-arm64-gui
          path: |
            ${{ runner.temp }}/macos-gui/NekoKEM-macos-arm64-GUI.zip
            ${{ runner.temp }}/macos-gui/NekoKEM-macos-arm64-GUI.dmg
            ${{ runner.temp }}/macos-gui/gui-SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: error

  build-linux-gui:
    name: Build Linux ${{ matrix.arch }} GUI
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
          targets: ${{ matrix.arch }}-unknown-linux-gnu
      - name: Install native GTK/WebKit build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential ca-certificates curl perl pkg-config binutils \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm
      - name: Check the native architecture and set the OpenSSL prefix
        run: |
          set -Eeuo pipefail
          test "$(uname -m)" = '${{ matrix.arch }}'
          echo "NEKOKEM_OPENSSL_PREFIX=$RUNNER_TEMP/linux-gui-openssl" >> "$GITHUB_ENV"
      - name: Build and verify the pinned static PIC dependency
        run: bash desktop/scripts/build-linux-openssl.sh '${{ matrix.arch }}' "$NEKOKEM_OPENSSL_PREFIX"
      - name: Install locked frontend dependencies
        working-directory: desktop
        run: npm ci --ignore-scripts
      - name: Build the native Linux desktop package
        working-directory: desktop
        run: bash scripts/build-linux-gui.sh '${{ matrix.arch }}'
      - name: Verify ELF hardening and package the exact installed application
        run: |
          python3 desktop/scripts/package-linux-gui.py \
            --bundle-dir 'desktop/src-tauri/target/${{ matrix.arch }}-unknown-linux-gnu/release/bundle' \
            --output "$RUNNER_TEMP/linux-gui" --arch '${{ matrix.arch }}' \
            --openssl-prefix "$NEKOKEM_OPENSSL_PREFIX" --source-sha "$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NekoKEM-linux-${{ matrix.arch }}-gui
          path: |
            ${{ runner.temp }}/linux-gui/NekoKEM-linux-${{ matrix.arch }}-GUI.tar.gz
            ${{ runner.temp }}/linux-gui/NekoKEM-linux-${{ matrix.arch }}-GUI.deb
            ${{ runner.temp }}/linux-gui/NekoKEM-linux-${{ matrix.arch }}-GUI.rpm
            ${{ runner.temp }}/linux-gui/gui-SHA256SUMS.txt
            ${{ runner.temp }}/linux-gui/gui-build-metadata.json
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

  attest:
    name: Attest public packages
    needs: [build-linux, signed-apk, build-windows, build-macos, build-linux-gui]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out the asset selection script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download this run's artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: ${{ runner.temp }}/release-artifacts
      # The same selection the Publish workflow uploads: the 14 packages and
      # their SHA256SUMS.txt, never the encrypted signing recovery envelope.
      - name: Select exactly the public packages
        run: python3 .github/scripts/release_assets.py collect "$RUNNER_TEMP/release-artifacts" "$RUNNER_TEMP/public"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/public/*
