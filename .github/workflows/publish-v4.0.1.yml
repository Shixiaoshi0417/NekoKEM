name: Publish NekoKEM v4.0.1
on:
  push:
    branches: ["claude/nekokem-pubkey-contacts-gui-h97w0p"]
permissions:
  contents: read
concurrency:
  group: publish-nekokem-v4.0.1
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'Shixiaoshi0417/NekoKEM' && github.ref == 'refs/heads/claude/nekokem-pubkey-contacts-gui-h97w0p'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate source and artifacts, then publish v4.0.1
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil, subprocess, tempfile
          payload = json.loads("{\"notes\": \"# NekoKEM v4.0.1\\n\\n## 简体中文\\n\\n### 本版更新\\n\\nv4.0.1 是安全修复版本，修复针对 v4.0.0 的一轮安全审查发现的问题：无 P0，1 项 P1、5 项 P2、1 项 P3，另有加固建议。文件格式、密码参数和公钥指纹均不变。Android 与所有 CLI/GUI 应用统一为 4.0.1，Core 仍为 4.0。\\n\\n- **Android 页面重建不再清除进行中操作的文件（P1）**：旋转屏幕或切换语言会重建页面，旧版会清空所有页面共用的缓存目录，而原页面发起的加解密可能仍在读写其中的文件。现在每个页面使用独立的缓存目录：关闭页面会取消它的操作，目录在最后一个操作返回后才删除；打开页面只清理不属于任何存活页面的残留。\\n- **生成密钥不再覆盖已有密钥**：CLI、桌面 GUI 和 Core 发现目标密钥已存在时拒绝生成，原文件不变。需要轮换时，CLI 使用 `keygen --replace`（或 `keygen hybrid --replace`），Android 会先请求确认，桌面 GUI 提示密钥已存在。密钥对改为原子“不覆盖”发布（硬链接，或 Linux `renameat2(RENAME_NOREPLACE)`、macOS `renamex_np(RENAME_EXCL)`），在 Android 禁止应用创建硬链接的 SELinux 策略下同样可用；成对提交持有目录锁，回滚前核对文件身份，不会删除其他进程写入的文件。Android 生成后的检查失败时不再删除已提交的私钥。\\n- **输出不能覆盖正在使用的密钥**：加解密的输出路径如果与本次使用的公钥或私钥是同一文件（包括 `./`、`..` 等写法），操作直接失败，不产生输出。例如 `decrypt hybrid cipher.nkem keys/private.key.enc keys/private.key.enc` 不会再覆盖私钥。\\n- **NKPR 私钥按内容识别**：CLI、桌面 GUI 和 Core 根据文件开头的 `NKPR` 判断私钥是否受密码保护，不再依赖 `.enc` 后缀；Android 导出的 `private.nkpr` 可直接使用，命名为 `.enc` 的明文 PEM 也不会被误判。\\n- **Android 密码输入**：密码框使用密码键盘，关闭自动更正、输入建议和输入法个性化学习。\\n- **Android 私钥导入**：替换前保留已同步的旧私钥副本，替换后同步密钥目录，失败时恢复原私钥。\\n- **Android 大小限制**：明文上限仍为 8 GiB；NKEM 文件上限另计容器开销（v3 加 1716 字节，v4 加 156 + 1672 × 接收方数字节），8 GiB 明文加密后的文件也能在 Android 上解密。\\n- **加固**：CI 与 Release 的全部 GitHub Actions 固定到提交哈希，Gradle 分发包校验 SHA-256；Windows 读取私钥等敏感文件时关闭 stdio 缓冲；AFL++ 新增完整解密 fuzz，覆盖 v3/v4 解封装、头部 MAC、载荷认证和输出提交。\\n- **测试**：新增 Core 密钥安全测试（Linux ASan/UBSan、macOS、Windows）；文件事务测试覆盖禁用硬链接、不支持原子重命名、并发写入竞态和交错回滚；Android 新增页面缓存与密钥生成检查的 JVM 测试，以及 API 26/35 设备上的拒绝覆盖与确认替换测试。\\n\\n### 兼容性提示\\n\\n- **`keygen` 行为变化**：已有密钥时不再覆盖。依赖重复运行 `keygen` 覆盖密钥的脚本需改用 `keygen --replace`。替换后旧私钥会被删除，用旧公钥加密的文件将无法再解密，执行前请备份旧密钥。\\n- 加解密的输出路径不能是本次操作使用的密钥文件。\\n- POSIX 系统上，成对生成密钥会在密钥目录留下 `0600` 锁文件 `.nekokem-pair.lock`，可以保留；操作运行期间不要删除。\\n- 文件格式不变：v4.0.1 与 v4.0.0 可互相解密 NKEM v3/v4 文件，NKPR v1 私钥和现有公钥照常使用。v3.3.2 及更早版本仍无法打开 NKEM v4 文件。\\n\\n### Android 升级\\n\\nAndroid 应用为 **4.0.1 / versionCode 9**，最低 API 26，目标 API 35，仅提供 arm64-v8a。**沿用 v3.2.0/v3.3.0 发布签名，可直接覆盖升级，无需卸载。** 建议先导出公钥和加密 NKPR 私钥，验证备份并保留私钥密码。\\n\\n仅旧签名 v3.1.x 用户需要在备份验证后卸载重装；卸载会删除内部密钥与数据，没有可用私钥或忘记密码将无法恢复解密。指纹不能恢复密钥。历史签名迁移见 [v3.2.0](https://github.com/Shixiaoshi0417/NekoKEM/blob/main/release/v3.2.0.md)。\\n\\n### 格式、安全边界与兼容性\\n\\n- **Core 仍为 4.0，NKEM v3、NKEM v4 与 NKPR v1 均不变**。X448 + ML-KEM-1024、HKDF-SHA512、AES-256-GCM、v3 header/AAD、KDF 输入与 domain、nonce/tag、指纹与 GCM 长度限制保持原有要求。NKEM v1/v2 不再支持。\\n- NKEM v4 会暴露接收方数量（不暴露身份）和文件长度。NKEM 不认证发送者：v4 的接收方共享文件密钥，任一接收方都能复用同一接收方列表制作新文件，接收方列表不能证明发件人。v4 隐藏的是哪条记录属于哪把私钥，而不是某把私钥能否解开文件。\\n- NKPR 仍使用 Argon2id **64 MiB、3 次迭代、并行度 4**，不降低密码成本；随机性、认证、敏感缓冲区清理和认证后提交规则保持不变。\\n- Windows 10/11 x64 保留本地固定 NTFS、所有者/ACL/可信父目录检查，以及网络、设备、ADS、重解析点拒绝。Windows CLI/GUI **没有 Authenticode 签名**；验证 Microsoft SDK loader 不代表应用已签名。GUI 需要 WebView2 Runtime。\\n- macOS 面向原生 M 系列 arm64，不提供 Intel/Rosetta 包。部署目标为 macOS 11.0，实际原生验证于 macOS 15；不等同于已验证 macOS 11.0 实机或每代芯片。包使用 **ad-hoc hardened-runtime 签名，没有 Developer ID 和 Apple 公证**，不能证明发布者身份或保证 Gatekeeper 放行。\\n- Linux GUI 构建基线为 Ubuntu 24.04，RPM 另在 Fedora 44 原生容器验证。需要 glibc 2.39+、GTK3 和 WebKitGTK 4.1；RPM 没有开发者 GPG 签名。X11 窗口检查不代表所有发行版或 Wayland 实机兼容。静态 Linux CLI 包继续提供。\\n- GUI 的 JavaScript/IPC 可能产生临时字符串副本，不能保证 WebView 堆可靠清零。成对文件提交不具备跨文件崩溃原子性；Windows 断电持久性、进程死亡、真实 SAF provider、并发修改和物理擦除仍有文档所述边界。不承诺跨系统或硬件性能相同。\\n\\n本项目仍是实验性工具，**没有经过独立专业安全审计，不应视为生产级软件，不应用于保护重要或敏感数据**。\\n\\n### 下载与校验\\n\\n| 平台 | 正式附件 |\\n|---|---|\\n| Android ARM64 | `app-release.apk` |\\n| Windows x64 | `NekoKEM-windows-x86_64.zip`、`NekoKEM-Windows-GUI.zip` |\\n| macOS Apple Silicon | `NekoKEM-macos-arm64.tar.gz`、`NekoKEM-macos-arm64-GUI.zip`、`NekoKEM-macos-arm64-GUI.dmg` |\\n| Linux x86_64 | `NekoKEM-linux-x86_64.tar.gz`、`NekoKEM-linux-x86_64-GUI.deb`、`NekoKEM-linux-x86_64-GUI.rpm`、`NekoKEM-linux-x86_64-GUI.tar.gz` |\\n| Linux ARM64 | `NekoKEM-linux-aarch64.tar.gz`、`NekoKEM-linux-aarch64-GUI.deb`、`NekoKEM-linux-aarch64-GUI.rpm`、`NekoKEM-linux-aarch64-GUI.tar.gz` |\\n\\n共 14 个正式包，另附顶层 `SHA256SUMS.txt`。先校验下载归档，再解包并校验包内文件。Linux DEB 使用 `sudo apt install ./NekoKEM-linux-x86_64-GUI.deb`，RPM 使用 `sudo dnf install ./NekoKEM-linux-x86_64-GUI.rpm`；ARM64 将文件名架构改为 `aarch64`。macOS 使用 GUI ZIP 中的 `.app` 或 DMG；CLI 包内 `NekoKEM.command` 打开 Terminal 菜单。\\n\\n全部正式包来自本版同一源码提交的成功 Release 构建，并以该提交通过的 CI 为发布前提。发布记录包含源码提交、CI/Release 链接、Android 签名证书指纹和全部附件 SHA-256。签名恢复信封仅保留为受保护 Actions 产物，不作为公开 Release 附件。\\n\\n### 构建与校验记录\\n\\n- 源码提交：[`35bfcaee89371082cc31a0de722d57a41d02c7c1`](https://github.com/Shixiaoshi0417/NekoKEM/tree/35bfcaee89371082cc31a0de722d57a41d02c7c1)\\n- CI：[运行 37601288064](https://github.com/Shixiaoshi0417/NekoKEM/actions/runs/37601288064)\\n- Release：[运行 37601305011](https://github.com/Shixiaoshi0417/NekoKEM/actions/runs/37601305011)\\n- 同一源码的 CI 与 Release 已全部成功；已核对构建产物来源、包内校验和及 Android 构建签名记录。Android 沿用原签名证书。\\n- Android 签名证书 SHA-256：`5a091b86b1cb339f081c1afa2aa71b986c07597343ce336f22d866b05c39fb50`\\n\\n```text\\n92ef1a1ac04cff86131a366a1803700d59cb323fba610a2d504dd39bffea12b5  NekoKEM-Windows-GUI.zip\\n491c2784fdc2cbe90f3e3d5d740b6fa9b4331334a329d2b87d0f15853a0e48f4  NekoKEM-linux-aarch64-GUI.deb\\n271a3c99409734b94c4866f2b428deebb6e9bb968c3d305ec95c5e53e1201ec4  NekoKEM-linux-aarch64-GUI.rpm\\nc025a3cba55b8b18a34d955104628a57ceea2be49d920bd7226e3c9c3e058e92  NekoKEM-linux-aarch64-GUI.tar.gz\\n7060313555cedf78602253c417cfd84acc9d05238f66ea1d7bf5df4f90f3f3ce  NekoKEM-linux-aarch64.tar.gz\\nfd0edd99d95bd46d00ace58029e772f4d237f977af1bf084bb50c2f6e844c336  NekoKEM-linux-x86_64-GUI.deb\\n2690869e1f94bb278158b9a4a00004870ac050309c785f141da126221c142fb4  NekoKEM-linux-x86_64-GUI.rpm\\nfcc1e0d61319e26a46a24eff0ea0515680f11246e471b4ac5cd22878d1ede171  NekoKEM-linux-x86_64-GUI.tar.gz\\n33e10768a835610734d518028019fc672faf20cb6983f584713caa48d8dd1b21  NekoKEM-linux-x86_64.tar.gz\\n0f5901793c2360d8b887c1bb5734cadd9397a534adb011b9389efba8137c524d  NekoKEM-macos-arm64-GUI.dmg\\nbc9e319ae1c49e681dcd3dbfb2fcbdc5c9e2429d5a96b09b1326c5414168fabf  NekoKEM-macos-arm64-GUI.zip\\n3352d923e4661bcecb4b45b05d1e7bfed0f39496f9be4b234025a635413b7b92  NekoKEM-macos-arm64.tar.gz\\nffa4c7b1b0ab99e23c58d1fd14b2ab70395858bb5f59ea060e0b58dc419c7f8f  NekoKEM-windows-x86_64.zip\\n8d47015c482751628f974884a8a268d37b4a8a04e73025fb71903f1c630b6b75  app-release.apk\\n```\\n\\n---\\n\\n## English\\n\\n### What's new\\n\\nv4.0.1 is a security-fix release for the findings of a security review of v4.0.0: no P0, one P1, five P2 and one P3, plus hardening suggestions. File formats, cryptographic parameters and public-key fingerprints are unchanged. Android and every CLI/GUI application are version 4.0.1; Core remains 4.0.\\n\\n- **Recreating an Android page no longer clears files of a running operation (P1)**: rotating the screen or changing the language recreates the page, and the previous release cleared the cache directory shared by every page while an operation started by the old page could still be reading or writing there. Each page now has its own cache directory: closing a page cancels its operations, and the directory is removed only after the last one returns. Opening a page removes only what no live page owns.\\n- **Key generation no longer overwrites existing keys**: the CLI, desktop GUI and Core refuse when a target key exists and leave it untouched. To rotate keys, use `keygen --replace` (or `keygen hybrid --replace`) in the CLI; Android asks for confirmation first, and the desktop GUI reports that keys exist. Key pairs are published atomically without replacing anything (a hard link, or Linux `renameat2(RENAME_NOREPLACE)` and macOS `renamex_np(RENAME_EXCL)`), which also works under Android's SELinux policy that forbids apps to create hard links. Paired commits hold directory locks and check file identity before rolling back, so they never remove a file another process wrote. On Android, a failed check after generation no longer deletes the committed private key.\\n- **Outputs cannot overwrite keys in use**: encryption and decryption fail without output when the output path is the same file as a public or private key used by the operation, including spellings with `./` or `..`. For example, `decrypt hybrid cipher.nkem keys/private.key.enc keys/private.key.enc` can no longer overwrite the private key.\\n- **NKPR private keys are recognized by content**: the CLI, desktop GUI and Core check for the leading `NKPR` to decide whether a private key is password-protected, instead of the `.enc` suffix. `private.nkpr` exported from Android works directly, and a plaintext PEM named `.enc` is no longer misread.\\n- **Android password input**: password fields use the password keyboard with autocorrection, suggestions and personalized keyboard learning turned off.\\n- **Android private-key import**: a synced copy of the old private key is kept until the replacement is in place, the key directory is synced afterwards, and a failure restores the original key.\\n- **Android size limits**: plaintext stays limited to 8 GiB; the NKEM file limit adds the container overhead (1716 bytes for v3, 156 + 1672 × recipients bytes for v4), so the encryption of an 8 GiB plaintext also decrypts on Android.\\n- **Hardening**: every GitHub Action in CI and Release is pinned to a commit hash, and the Gradle distribution is checked against its SHA-256. Windows reads private keys and other sensitive files without stdio buffering. AFL++ adds a full-decryption fuzzer covering v3/v4 decapsulation, the header MAC, payload authentication and the output commit.\\n- **Tests**: new Core key-safety tests (Linux ASan/UBSan, macOS, Windows). File-transaction tests cover disabled hard links, missing atomic no-replace rename, concurrent-writer races and interleaved rollback. Android adds JVM tests for page caches and post-generation checks, plus device tests on API 26/35 for refused overwrites and confirmed replacement.\\n\\n### Compatibility notice\\n\\n- **`keygen` behaves differently**: it no longer overwrites existing keys. Scripts that rerun `keygen` to overwrite keys need `keygen --replace`. Replacing deletes the old private key, so files encrypted for the old public key can no longer be decrypted; back up the old keys first.\\n- Encryption and decryption outputs cannot be a key file used by the same operation.\\n- On POSIX systems, generating a key pair leaves the mode `0600` lock file `.nekokem-pair.lock` in the key directory. It can stay there; do not delete it while an operation runs.\\n- File formats are unchanged: v4.0.1 and v4.0.0 decrypt each other's NKEM v3/v4 files, and NKPR v1 private keys and existing public keys keep working. v3.3.2 and earlier still cannot open NKEM v4 files.\\n\\n### Updating Android\\n\\nAndroid is **4.0.1 / versionCode 9**, minimum API 26, targeting API 35, with arm64-v8a only. **The v3.2.0/v3.3.0 release signer is retained, allowing an in-place update without uninstalling.** Back up the public key and encrypted NKPR private key, verify those backups and retain the private-key password first.\\n\\nOnly old-signer v3.1.x installations need verified backups followed by uninstall/reinstall. Uninstalling deletes private keys and data; without a usable private key or its password, decryption cannot be recovered. Fingerprints cannot restore keys. Historical signing migration is documented in [v3.2.0](https://github.com/Shixiaoshi0417/NekoKEM/blob/main/release/v3.2.0.md).\\n\\n### Formats, security boundaries and compatibility\\n\\n- **Core remains 4.0; NKEM v3, NKEM v4 and NKPR v1 are unchanged**. X448 + ML-KEM-1024, HKDF-SHA512, AES-256-GCM, v3 headers/AAD, KDF inputs/domains, nonce/tag, fingerprints and GCM length limits retain their requirements. NKEM v1/v2 are no longer supported.\\n- NKEM v4 reveals the number of recipients (not who they are) and the file length. NKEM does not authenticate senders: v4 recipients share the file key, so any recipient can create a new file reusing the same recipient list, and the list does not prove who sent a file. v4 hides which entry belongs to which key, not whether a key can decrypt the file.\\n- NKPR still uses Argon2id with **64 MiB, 3 iterations and parallelism 4**, without reducing password cost. Randomness, authentication, sensitive-buffer cleanup and authenticated output commits retain their requirements.\\n- Windows 10/11 x64 retains local fixed NTFS, ownership/ACL/trusted-ancestor checks and rejection of network/device/ADS/reparse paths. Windows CLI/GUI are **not Authenticode signed**; verifying the Microsoft SDK loader does not sign the applications. The GUI requires WebView2 Runtime.\\n- macOS targets native M-series arm64, without Intel/Rosetta packages. The deployment target is macOS 11.0; native verification runs on macOS 15, not physical macOS 11.0 hardware or every chip generation. Packages use **ad-hoc hardened-runtime signatures without Developer ID or Apple notarization**, so they do not authenticate the publisher or guarantee Gatekeeper acceptance.\\n- Linux GUI builds use Ubuntu 24.04; RPM is additionally verified in native Fedora 44 containers. glibc 2.39+, GTK3 and WebKitGTK 4.1 are required. RPM is not developer GPG signed. X11 checks do not establish compatibility with every distribution or physical Wayland session. Static Linux CLI packages remain available.\\n- JavaScript/IPC may create temporary string copies, so reliable WebView heap zeroization is not guaranteed. Paired-file commits are not crash atomic across files. Windows power-loss durability, process death, real SAF providers, concurrent modification and physical erasure retain documented limits. Identical performance across systems or hardware is not promised.\\n\\nThis remains experimental software. **It has not undergone an independent professional security audit, must not be considered production-grade, and must not be used to protect important or sensitive data.**\\n\\n### Downloads and verification\\n\\n| Platform | Public assets |\\n|---|---|\\n| Android ARM64 | `app-release.apk` |\\n| Windows x64 | `NekoKEM-windows-x86_64.zip`, `NekoKEM-Windows-GUI.zip` |\\n| macOS Apple Silicon | `NekoKEM-macos-arm64.tar.gz`, `NekoKEM-macos-arm64-GUI.zip`, `NekoKEM-macos-arm64-GUI.dmg` |\\n| Linux x86_64 | `NekoKEM-linux-x86_64.tar.gz`, `NekoKEM-linux-x86_64-GUI.deb`, `NekoKEM-linux-x86_64-GUI.rpm`, `NekoKEM-linux-x86_64-GUI.tar.gz` |\\n| Linux ARM64 | `NekoKEM-linux-aarch64.tar.gz`, `NekoKEM-linux-aarch64-GUI.deb`, `NekoKEM-linux-aarch64-GUI.rpm`, `NekoKEM-linux-aarch64-GUI.tar.gz` |\\n\\nThere are 14 packages plus top-level `SHA256SUMS.txt`. Verify each downloaded archive, then extract and verify its internal files. Install Linux DEB with `sudo apt install ./NekoKEM-linux-x86_64-GUI.deb`, or RPM with `sudo dnf install ./NekoKEM-linux-x86_64-GUI.rpm`; substitute `aarch64` for ARM64. On macOS use the `.app` in the GUI ZIP or DMG. The CLI archive's `NekoKEM.command` opens the Terminal menu.\\n\\nAll public packages come from the successful Release build of the same v4.0.1 source commit, gated by that commit's successful CI. Publication records include the source commit, CI/Release links, Android signer certificate fingerprint and every asset's SHA-256. The encrypted signing recovery envelope remains a protected Actions artifact and is not attached to the public Release.\\n\\n### Build and verification records\\n\\n- Source commit: [`35bfcaee89371082cc31a0de722d57a41d02c7c1`](https://github.com/Shixiaoshi0417/NekoKEM/tree/35bfcaee89371082cc31a0de722d57a41d02c7c1)\\n- CI: [run 37601288064](https://github.com/Shixiaoshi0417/NekoKEM/actions/runs/37601288064)\\n- Release: [run 37601305011](https://github.com/Shixiaoshi0417/NekoKEM/actions/runs/37601305011)\\n- CI and Release for the same source commit succeeded. Artifact provenance, internal checksums and Android signing build records were verified. The Android signing identity is retained.\\n- Android signing certificate SHA-256: `5a091b86b1cb339f081c1afa2aa71b986c07597343ce336f22d866b05c39fb50`\\n\\n```text\\n92ef1a1ac04cff86131a366a1803700d59cb323fba610a2d504dd39bffea12b5  NekoKEM-Windows-GUI.zip\\n491c2784fdc2cbe90f3e3d5d740b6fa9b4331334a329d2b87d0f15853a0e48f4  NekoKEM-linux-aarch64-GUI.deb\\n271a3c99409734b94c4866f2b428deebb6e9bb968c3d305ec95c5e53e1201ec4  NekoKEM-linux-aarch64-GUI.rpm\\nc025a3cba55b8b18a34d955104628a57ceea2be49d920bd7226e3c9c3e058e92  NekoKEM-linux-aarch64-GUI.tar.gz\\n7060313555cedf78602253c417cfd84acc9d05238f66ea1d7bf5df4f90f3f3ce  NekoKEM-linux-aarch64.tar.gz\\nfd0edd99d95bd46d00ace58029e772f4d237f977af1bf084bb50c2f6e844c336  NekoKEM-linux-x86_64-GUI.deb\\n2690869e1f94bb278158b9a4a00004870ac050309c785f141da126221c142fb4  NekoKEM-linux-x86_64-GUI.rpm\\nfcc1e0d61319e26a46a24eff0ea0515680f11246e471b4ac5cd22878d1ede171  NekoKEM-linux-x86_64-GUI.tar.gz\\n33e10768a835610734d518028019fc672faf20cb6983f584713caa48d8dd1b21  NekoKEM-linux-x86_64.tar.gz\\n0f5901793c2360d8b887c1bb5734cadd9397a534adb011b9389efba8137c524d  NekoKEM-macos-arm64-GUI.dmg\\nbc9e319ae1c49e681dcd3dbfb2fcbdc5c9e2429d5a96b09b1326c5414168fabf  NekoKEM-macos-arm64-GUI.zip\\n3352d923e4661bcecb4b45b05d1e7bfed0f39496f9be4b234025a635413b7b92  NekoKEM-macos-arm64.tar.gz\\nffa4c7b1b0ab99e23c58d1fd14b2ab70395858bb5f59ea060e0b58dc419c7f8f  NekoKEM-windows-x86_64.zip\\n8d47015c482751628f974884a8a268d37b4a8a04e73025fb71903f1c630b6b75  app-release.apk\\n```\\n\", \"hashes\": {\"app-release.apk\": \"8d47015c482751628f974884a8a268d37b4a8a04e73025fb71903f1c630b6b75\", \"NekoKEM-Windows-GUI.zip\": \"92ef1a1ac04cff86131a366a1803700d59cb323fba610a2d504dd39bffea12b5\", \"NekoKEM-linux-aarch64-GUI.deb\": \"491c2784fdc2cbe90f3e3d5d740b6fa9b4331334a329d2b87d0f15853a0e48f4\", \"NekoKEM-linux-aarch64-GUI.rpm\": \"271a3c99409734b94c4866f2b428deebb6e9bb968c3d305ec95c5e53e1201ec4\", \"NekoKEM-linux-aarch64-GUI.tar.gz\": \"c025a3cba55b8b18a34d955104628a57ceea2be49d920bd7226e3c9c3e058e92\", \"NekoKEM-linux-aarch64.tar.gz\": \"7060313555cedf78602253c417cfd84acc9d05238f66ea1d7bf5df4f90f3f3ce\", \"NekoKEM-linux-x86_64-GUI.deb\": \"fd0edd99d95bd46d00ace58029e772f4d237f977af1bf084bb50c2f6e844c336\", \"NekoKEM-linux-x86_64-GUI.rpm\": \"2690869e1f94bb278158b9a4a00004870ac050309c785f141da126221c142fb4\", \"NekoKEM-linux-x86_64-GUI.tar.gz\": \"fcc1e0d61319e26a46a24eff0ea0515680f11246e471b4ac5cd22878d1ede171\", \"NekoKEM-linux-x86_64.tar.gz\": \"33e10768a835610734d518028019fc672faf20cb6983f584713caa48d8dd1b21\", \"NekoKEM-macos-arm64-GUI.dmg\": \"0f5901793c2360d8b887c1bb5734cadd9397a534adb011b9389efba8137c524d\", \"NekoKEM-macos-arm64-GUI.zip\": \"bc9e319ae1c49e681dcd3dbfb2fcbdc5c9e2429d5a96b09b1326c5414168fabf\", \"NekoKEM-macos-arm64.tar.gz\": \"3352d923e4661bcecb4b45b05d1e7bfed0f39496f9be4b234025a635413b7b92\", \"NekoKEM-windows-x86_64.zip\": \"ffa4c7b1b0ab99e23c58d1fd14b2ab70395858bb5f59ea060e0b58dc419c7f8f\"}}")
          repo = "Shixiaoshi0417/NekoKEM"
          source = "35bfcaee89371082cc31a0de722d57a41d02c7c1"
          tag = "v4.0.1"
          def gh(*args):
              return subprocess.check_output(["gh", *args], text=True)
          def api(path):
              return json.loads(gh("api", path))
          for run_id, workflow in [(37601288064, "CI"), (37601305011, "Release")]:
              run = api(f"repos/{repo}/actions/runs/{run_id}")
              assert run["head_sha"] == source and run["name"] == workflow and run["head_branch"] == "main"
              assert run["status"] == "completed" and run["conclusion"] == "success"
          work = pathlib.Path(tempfile.mkdtemp(prefix="nekokem-publish-", dir=os.environ["RUNNER_TEMP"]))
          download = work / "artifacts"
          subprocess.run(["gh", "run", "download", "37601305011", "--repo", repo, "--dir", str(download)], check=True)
          public = work / "public"
          public.mkdir()
          for name, expected in payload["hashes"].items():
              matches = list(download.rglob(name))
              assert len(matches) == 1, (name, matches)
              assert hashlib.sha256(matches[0].read_bytes()).hexdigest() == expected, name
              shutil.copy2(matches[0], public / name)
          metadata = json.loads((download / "NekoKEM-android-signed" / "build-metadata.json").read_text())
          assert metadata["source_sha"] == source and metadata["run_id"] == 37601305011
          assert metadata["version"] == "4.0.1" and metadata["version_code"] == 9 and metadata["core_version"] == "4.0"
          assert metadata["apk_sha256"] == payload["hashes"]["app-release.apk"]
          assert metadata["signer_sha256"] == "5a091b86b1cb339f081c1afa2aa71b986c07597343ce336f22d866b05c39fb50"
          assert metadata["signing_key_rotated"] is False
          sums = "".join(f"{digest}  {name}\n" for name, digest in sorted(payload["hashes"].items()))
          (public / "SHA256SUMS.txt").write_text(sums)
          notes = work / "notes.md"
          notes.write_text(payload["notes"])
          probe = subprocess.run(["gh", "api", f"repos/{repo}/git/ref/tags/{tag}"], capture_output=True, text=True)
          if probe.returncode == 0:
              ref = json.loads(probe.stdout)["object"]
              while ref["type"] == "tag":
                  ref = api(f"repos/{repo}/git/tags/{ref['sha']}")["object"]
              assert ref["type"] == "commit" and ref["sha"] == source, "Tag points to a different source"
          elif "404" not in probe.stderr:
              raise RuntimeError("Unable to verify tag")
          releases = api(f"repos/{repo}/releases?per_page=100")
          matches = [r for r in releases if r["tag_name"] == tag]
          assert len(matches) <= 1
          if matches:
              release = matches[0]
              assert release["draft"] is True, "Release already published; refuse to modify"
              assert release["target_commitish"] == source and release["body"] == payload["notes"]
          else:
              # The release list can lag behind a new draft, so keep the ID the create call returns.
              created = json.loads(gh("api", "-X", "POST", f"repos/{repo}/releases", "-f", f"tag_name={tag}", "-f", f"target_commitish={source}", "-f", "name=NekoKEM v4.0.1", "-F", f"body=@{notes}", "-F", "draft=true"))
              release = api(f"repos/{repo}/releases/{created['id']}")
              assert release["draft"] is True and release["tag_name"] == tag
          release_id = release["id"]
          assets = sorted(public.iterdir())
          assert len(assets) == 15 and not any("recovery" in p.name for p in assets)
          if not release["assets"]:
              subprocess.run(["gh", "release", "upload", tag, "--repo", repo, *[str(p) for p in assets]], check=True)
          release = api(f"repos/{repo}/releases/{release_id}")
          expected = {p.name: "sha256:" + hashlib.sha256(p.read_bytes()).hexdigest() for p in assets}
          assert len(release["assets"]) == 15
          assert {a["name"]: a["digest"] for a in release["assets"]} == expected, "Uploaded digest mismatch"
          assert release["body"] == payload["notes"], "Release notes mismatch"
          subprocess.run(["gh", "release", "edit", tag, "--repo", repo, "--draft=false", "--latest"], check=True)
          release = api(f"repos/{repo}/releases/{release_id}")
          assert release["draft"] is False and release["prerelease"] is False
          assert {a["name"]: a["digest"] for a in release["assets"]} == expected
          ref = api(f"repos/{repo}/git/ref/tags/{tag}")["object"]
          while ref["type"] == "tag":
              ref = api(f"repos/{repo}/git/tags/{ref['sha']}")["object"]
          assert ref["type"] == "commit" and ref["sha"] == source, "Published tag points to a different source"
          print("Published verified Release:", release["html_url"])
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write(f"Published [{tag}]({release['html_url']}) from `{source}` with 14 packages and SHA256SUMS.txt.\n")
          PY
