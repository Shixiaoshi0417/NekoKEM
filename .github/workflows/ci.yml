name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NEKOKEM_BUILD_TESTS: "1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-tests:
    name: Linux Core and CLI tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Check out performance baseline
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
          path: performance-baseline-source

      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            afl++ build-essential ca-certificates curl perl

      - name: Check application and signing version consistency
        run: |
          python3 scripts/check_versions.py
          python3 scripts/test_version_checks.py -v

      - name: Test atomic performance report saving
        run: python3 scripts/test_profile_reports.py -v

      # The build below depends only on the pinned source, this step's flags
      # and the runner's compiler, so a cached prefix is reused until any of
      # those changes.
      - name: Identify the native compiler for the OpenSSL cache
        id: compiler
        run: echo "identity=$(gcc --version | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Restore the pinned OpenSSL build
        id: openssl-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/openssl-4.1.0
          key: linux-tests-openssl-4.1.0-${{ steps.compiler.outputs.identity }}-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Build OpenSSL 4.1.0
        if: steps.openssl-cache.outputs.cache-hit != 'true'
        env:
          OPENSSL_VERSION: "4.1.0"
          OPENSSL_SHA256: 50c17baf54cb008f6ce42d50deb4b28050a1aad711636cabd4b241c7e90cc2fd
        run: |
          set -Eeuo pipefail
          build_root="$RUNNER_TEMP/openssl-build"
          install_root="$RUNNER_TEMP/openssl-$OPENSSL_VERSION"
          archive="$build_root/openssl-$OPENSSL_VERSION.tar.gz"
          source_dir="$build_root/source"

          mkdir -p "$build_root" "$source_dir"
          curl --fail --location --silent --show-error --proto '=https' \
            --tlsv1.2 --retry 3 \
            --output "$archive" \
            "https://github.com/openssl/openssl/releases/download/openssl-$OPENSSL_VERSION/openssl-$OPENSSL_VERSION.tar.gz"
          printf '%s  %s\n' "$OPENSSL_SHA256" "$archive" | sha256sum -c -
          tar --extract --gzip --file "$archive" \
            --directory "$source_dir" --strip-components=1 --no-same-owner

          cd "$source_dir"
          perl ./Configure linux-x86_64 \
            no-shared no-module no-dso no-tests no-apps no-docs \
            no-sock no-zlib no-zstd \
            --prefix="$install_root" --openssldir=/etc/ssl --libdir=lib
          make --silent -j2
          make --silent install_dev

      - name: Run complete Linux test suite
        env:
          CPATH: ${{ runner.temp }}/openssl-4.1.0/include
          LIBRARY_PATH: ${{ runner.temp }}/openssl-4.1.0/lib
        run: make -C linux test

      - name: Verify build-only release mode preserves the Linux binary
        run: |
          set -Eeuo pipefail
          export NEKOKEM_OPENSSL_PREFIX="$RUNNER_TEMP/openssl-4.1.0"
          for mode in 1 0; do
            NEKOKEM_BUILD_TESTS="$mode" bash linux/scripts/build-linux-release.sh \
              x86_64 "$RUNNER_TEMP/release-mode-$mode"
          done
          cmp "$RUNNER_TEMP/release-mode-1/NekoKEM-linux-x86_64.tar.gz" \
              "$RUNNER_TEMP/release-mode-0/NekoKEM-linux-x86_64.tar.gz"

      - name: Compare Linux throughput against the PR base
        env:
          CPATH: ${{ runner.temp }}/openssl-4.1.0/include
          LIBRARY_PATH: ${{ runner.temp }}/openssl-4.1.0/lib
        run: |
          set -Eeuo pipefail
          # Both builds use the same runner, pinned OpenSSL and hardened flags.
          make -C performance-baseline-source/linux all
          python3 scripts/benchmark_throughput.py \
            --baseline performance-baseline-source/linux/nekokem \
            --candidate linux/nekokem \
            --json "$RUNNER_TEMP/linux-throughput-comparison.json"

      - name: Preserve Linux before-and-after throughput measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-throughput-comparison
          path: ${{ runner.temp }}/linux-throughput-comparison.json
          if-no-files-found: warn
          retention-days: 14

      - name: Test fuzz result and process failure handling
        run: python3 .github/scripts/test_fuzz_smoke.py -v

      - name: Test emulator image installation failure handling
        run: python3 .github/scripts/test_android_emulator_image.py

      - name: Test release signing configuration and identity persistence
        run: python3 .github/scripts/test_release_signing.py -v

      - name: Test publication and failure recovery
        run: python3 .github/scripts/test_publish_release.py -v

      - name: Test public release asset selection and checks
        run: python3 .github/scripts/test_release_assets.py -v

      - name: Run parser and decryption fuzz smoke tests
        env:
          AFL_I_DONT_CARE_ABOUT_MISSING_CRASHES: "1"
          AFL_NO_UI: "1"
          AFL_SKIP_CPUFREQ: "1"
          CPATH: ${{ runner.temp }}/openssl-4.1.0/include
          LIBRARY_PATH: ${{ runner.temp }}/openssl-4.1.0/lib
        run: |
          set -Eeuo pipefail
          make -C linux fuzz-build \
            FUZZ_LDFLAGS="-fsanitize=undefined -L$LIBRARY_PATH"
          status=0
          for format in nkem nkpr decrypt identity; do
            if ! python3 .github/scripts/run_fuzz_smoke.py \
              --seeds "core/fuzz/seeds/$format" \
              --target "core/fuzz/bin/fuzz_$format" \
              --output "$RUNNER_TEMP/fuzz-$format"; then
              status=1
            fi
          done
          exit "$status"

      - name: Archive fuzz results with original AFL filenames
        if: always()
        run: python3 .github/scripts/archive_fuzz_results.py "$RUNNER_TEMP"

      - name: Preserve fuzz logs, statistics and samples
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: parser-fuzz-results
          path: ${{ runner.temp }}/parser-fuzz-results.tar.gz
          if-no-files-found: warn
          retention-days: 14

  android-build:
    name: Android debug build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Robolectric loads the miuix classes on the JVM; they are Java 21
      # class files. The App itself still compiles for Java 17.
      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install pinned Android toolchain
        run: |
          set -Eeuo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager_path=$(find "$sdk_root/cmdline-tools" -maxdepth 3 \
            -type f -name sdkmanager -print -quit)
          if [ -z "$sdkmanager_path" ]; then
            echo "sdkmanager not found under $sdk_root/cmdline-tools" >&2
            exit 1
          fi
          # build-tools 35.0.0 is the pinned signer for the throwaway signing check.
          "$sdkmanager_path" \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"
          printf 'ANDROID_SDK_ROOT=%s\n' "$sdk_root" >> "$GITHUB_ENV"
          printf 'ANDROID_NDK_ROOT=%s/ndk/28.2.13676358\n' \
            "$sdk_root" >> "$GITHUB_ENV"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Restore the pinned Android OpenSSL build
        id: android-openssl-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: android/app/src/main/cpp/third_party/openssl/arm64-v8a
          # The script pins the OpenSSL source, NDK and flags.
          key: android-openssl-arm64-v8a-${{ hashFiles('android/scripts/build-openssl-android.sh') }}
      - name: Build OpenSSL 4.1.0 for Android arm64
        if: steps.android-openssl-cache.outputs.cache-hit != 'true'
        working-directory: android
        env:
          JOBS: "2"
        run: sh scripts/build-openssl-android.sh

      - name: Run Android unit tests and build debug artifacts
        working-directory: android
        run: |
          bash ./gradlew --no-daemon --stacktrace \
            testDebugUnitTest \
            assembleDebug \
            assembleDebugAndroidTest

      # Release builds the APK unsigned and signs it in a separate job; run
      # that same path here with a throwaway key that is never uploaded.
      - name: Build the unsigned release APK and sign it with a throwaway key
        env:
          ROTATE_SIGNING: "true"
        run: |
          set -Eeuo pipefail
          (cd android && bash ./gradlew --no-daemon --stacktrace \
            -PnekokemUnsignedRelease=true assembleRelease)
          python3 .github/scripts/sign_android_release.py sign \
            android/app/build/outputs/apk/release/app-release-unsigned.apk \
            "$RUNNER_TEMP/throwaway-signed"
          test ! -e "$RUNNER_TEMP/nekokem-release-signing"
          python3 .github/scripts/sign_android_release.py verify \
            android/app/build/outputs/apk/release/app-release-unsigned.apk \
            "$RUNNER_TEMP/throwaway-signed"
          rm -rf -- "$RUNNER_TEMP/throwaway-signed"

      - name: Preserve executed JVM test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-jvm-test-results
          path: |
            android/app/build/test-results/testDebugUnitTest/
            android/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

  android-instrumentation:
    name: Android device tests (API ${{ matrix.api }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # API 29 sits between the oldest and newest app seccomp and storage policies.
        api: [26, 29, 35, 36]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install pinned native toolchain
        run: |
          set -Eeuo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager_path=$(find "$sdk_root/cmdline-tools" -maxdepth 3 \
            -type f -name sdkmanager -print -quit)
          if [ -z "$sdkmanager_path" ]; then
            echo "sdkmanager not found under $sdk_root/cmdline-tools" >&2
            exit 1
          fi
          "$sdkmanager_path" \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"
          printf 'ANDROID_SDK_ROOT=%s\n' "$sdk_root" >> "$GITHUB_ENV"
          printf 'ANDROID_NDK_ROOT=%s/ndk/28.2.13676358\n' \
            "$sdk_root" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Restore the pinned Android OpenSSL build
        id: android-openssl-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: android/app/src/main/cpp/third_party/openssl/x86_64
          # The script pins the OpenSSL source, NDK and flags.
          key: android-openssl-x86_64-${{ hashFiles('android/scripts/build-openssl-android.sh') }}
      - name: Build pinned OpenSSL for the test emulator
        if: steps.android-openssl-cache.outputs.cache-hit != 'true'
        working-directory: android
        env:
          JOBS: "2"
        run: sh scripts/build-openssl-android.sh x86_64
      - name: Build emulator app and device tests
        working-directory: android
        run: |
          bash ./gradlew --no-daemon -PnekokemEmulatorTest=true tasks --all \
            > "$RUNNER_TEMP/nekokem-emulator-tasks.txt"
          if grep -Eq '^([[:alnum:]_.-]+:)*(assembleRelease|bundleRelease)([[:space:]]|$)' \
              "$RUNNER_TEMP/nekokem-emulator-tasks.txt"; then
            echo "Emulator test configuration must not expose release variants" >&2
            exit 1
          fi
          bash ./gradlew --no-daemon --stacktrace -PnekokemEmulatorTest=true assembleDebug assembleDebugAndroidTest
          # The same device tests against an R8-minified build with the release rules.
          bash ./gradlew --no-daemon --stacktrace -PnekokemEmulatorTest=true \
            -PnekokemMinifiedTest=true assembleMinified assembleMinifiedAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and verify emulator image with bounded download retries
        run: bash .github/scripts/install_android_emulator_image.sh "$ANDROID_SDK_ROOT" "${{ matrix.api }}"
      - name: Execute JNI, SAF and language tests on a device, debug and minified
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            adb shell svc power stayon true
            adb shell settings put system screen_off_timeout 1800000
            # API 35 Pixel Launcher ANRs can cover the app with a system dialog.
            # Disable only this unrelated launcher in the disposable test device.
            # App ANRs and all JNI/SAF/language assertions remain enabled.
            if [ '${{ matrix.api }}' = 35 ]; then adb shell pm disable-user --user 0 com.google.android.apps.nexuslauncher; fi
            adb shell settings put system font_scale 1.5
            adb shell cmd uimode night yes
            bash .github/scripts/run_android_device_tests.sh android/device-reports
            bash .github/scripts/run_android_minified_device_tests.sh android/device-reports/minified
      - name: Preserve actual device test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-device-api-${{ matrix.api }}
          path: android/device-reports/
          if-no-files-found: warn
          retention-days: 14

  build-linux:
    name: Build and test ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential ca-certificates curl perl

      - name: Build, verify, and package
        run: bash linux/scripts/build-linux-release.sh "${{ matrix.arch }}" "$GITHUB_WORKSPACE/dist"

      - name: Test pinned-release installer
        run: |
          sh core/tests/install_script_tests.sh \
            "${{ matrix.arch }}" \
            "dist/NekoKEM-linux-${{ matrix.arch }}.tar.gz"

      - name: Run i18n regressions against the native release binary
        run: |
          release_test_dir="$RUNNER_TEMP/release-i18n"
          mkdir -p "$release_test_dir"
          tar -xzf "dist/NekoKEM-linux-${{ matrix.arch }}.tar.gz" -C "$release_test_dir" --strip-components=1
          python3 scripts/check_i18n.py
          python3 linux/tests/i18n_tests.py "$release_test_dir/nekokem"

      - name: Upload Linux archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NekoKEM-linux-${{ matrix.arch }}
          path: dist/NekoKEM-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  baseline-linux:
    name: Historical Linux fixtures and current CLI contract
    needs: build-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: 3ce869eea9384859cc5808918d4672c43eab8c92
          path: baseline-source
      - name: Build pre-port main Linux CLI with pinned OpenSSL
        run: |
          bash baseline-source/linux/scripts/build-linux-release.sh x86_64 "$RUNNER_TEMP/baseline-dist"
          mkdir -p "$RUNNER_TEMP/baseline-bin"
          tar -xzf "$RUNNER_TEMP/baseline-dist/NekoKEM-linux-x86_64.tar.gz" -C "$RUNNER_TEMP/baseline-bin"
          executable=$(find "$RUNNER_TEMP/baseline-bin" -type f -name nekokem -print -quit)
          test -n "$executable"
          cp "$executable" "$RUNNER_TEMP/baseline-nekokem"
          python3 windows/tests/interop.py generate "$RUNNER_TEMP/baseline-nekokem" "$RUNNER_TEMP/linux-fixtures"
      - name: Download current Linux CLI build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: NekoKEM-linux-x86_64
          path: ${{ runner.temp }}/current-linux-dist
      - name: Generate current Linux CLI output contract
        run: |
          mkdir -p "$RUNNER_TEMP/current-linux-bin"
          tar -xzf "$RUNNER_TEMP/current-linux-dist/NekoKEM-linux-x86_64.tar.gz" \
            --strip-components=1 -C "$RUNNER_TEMP/current-linux-bin"
          python3 windows/tests/interop.py contract \
            "$RUNNER_TEMP/current-linux-bin/nekokem" "$RUNNER_TEMP/linux-fixtures"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pre-port-linux-cli
          path: ${{ runner.temp }}/baseline-nekokem
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-linux-interop-fixtures
          path: |
            ${{ runner.temp }}/linux-fixtures/linux-public.key
            ${{ runner.temp }}/linux-fixtures/linux-fingerprint.txt
            ${{ runner.temp }}/linux-fixtures/linux-cli-contract.json
            ${{ runner.temp }}/linux-fixtures/linux-private.enc
            ${{ runner.temp }}/linux-fixtures/binary
            ${{ runner.temp }}/linux-fixtures/empty
            ${{ runner.temp }}/linux-fixtures/*.linux.nkem
          retention-days: 14
          if-no-files-found: error

  windows-native:
    name: Windows CLI build and tests
    needs: baseline-linux
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Check out performance baseline
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
          path: performance-baseline-source
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          # MSYS2 requires a coherent rolling package set; see release/README.md.
          update: true
          install: >-
            make perl curl tar
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python
      - name: Identify native compiler
        id: compiler
        shell: msys2 {0}
        run: echo "version=$(gcc -dumpfullversion)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: openssl-cache
        with:
          path: ${{ runner.temp }}/windows-openssl
          key: windows-ucrt64-openssl-4.1.0-${{ steps.compiler.outputs.version }}-${{ hashFiles('windows/scripts/build-windows-cli.sh') }}
          restore-keys: windows-ucrt64-openssl-4.1.0-${{ steps.compiler.outputs.version }}-
      - name: Build native x64 EXE with pinned OpenSSL and verify PE mitigations
        shell: msys2 {0}
        run: |
          export NEKOKEM_OPENSSL_PREFIX="$(cygpath -u "$RUNNER_TEMP")/windows-openssl"
          bash windows/scripts/build-windows-cli.sh "$(cygpath -u "$RUNNER_TEMP")/windows-cli"
      - name: Build performance baseline with the same compiler and OpenSSL
        shell: msys2 {0}
        env:
          GITHUB_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          export NEKOKEM_OPENSSL_PREFIX="$(cygpath -u "$RUNNER_TEMP")/windows-openssl"
          # Use the same pinned build recipe for both performance builds.
          # Baseline production Core and CLI sources remain at the requested ref.
          cp windows/scripts/build-windows-cli.sh \
            performance-baseline-source/windows/scripts/build-windows-cli.sh
          cp core/tests/openssl_version_tests.c \
            performance-baseline-source/core/tests/openssl_version_tests.c
          # The recipe runs its checks from the tree it builds.
          mkdir -p performance-baseline-source/windows/tests
          cp windows/tests/check_icon.py performance-baseline-source/windows/tests/check_icon.py
          bash performance-baseline-source/windows/scripts/build-windows-cli.sh \
            "$(cygpath -u "$RUNNER_TEMP")/windows-cli-performance-baseline"
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: success() && steps.openssl-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/windows-openssl
          key: ${{ steps.openssl-cache.outputs.cache-primary-key }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: public-linux-interop-fixtures
          path: ${{ runner.temp }}/linux-fixtures
      - name: Execute native Windows security, CLI and interoperability tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = Join-Path $env:RUNNER_TEMP 'windows-cli'
          $work = Join-Path ([Environment]::GetFolderPath('LocalApplicationData')) "NekoKEM-ci-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Path $work | Out-Null
          $env:TEMP = $work
          $env:TMP = $work
          # Public CI directory metadata helps diagnose fail-closed NTFS checks.
          $ancestor = Get-Item $work
          while ($null -ne $ancestor) {
            $acl = Get-Acl $ancestor.FullName
            Write-Host ($ancestor.FullName + ' owner=' + $acl.Owner + ' sddl=' + $acl.Sddl)
            $ancestor = $ancestor.Parent
          }
          try {
            foreach ($name in @('openssl_version', 'hybrid_kdf', 'gcm_limit', 'aes_stream', 'parser', 'multi_recipient', 'signature', 'payload_hash', 'key_safety', 'windows_core', 'console')) {
              $testDirectory = Join-Path $work $name
              New-Item -ItemType Directory -Path $testDirectory | Out-Null
              Push-Location $testDirectory
              try {
                & (Join-Path $bin "${name}_tests.exe")
                if ($LASTEXITCODE -ne 0) { throw "$name failed: $LASTEXITCODE" }
              } finally { Pop-Location }
            }
            python windows/tests/cli_tests.py (Join-Path $bin 'nekokem.exe')
            if ($LASTEXITCODE -ne 0) { throw 'Native CLI tests failed' }
            $interop = Join-Path $work 'interop'
            Copy-Item (Join-Path $env:RUNNER_TEMP 'linux-fixtures') $interop -Recurse
            python windows/tests/interop.py windows (Join-Path $bin 'nekokem.exe') $interop
            if ($LASTEXITCODE -ne 0) { throw 'Linux-to-Windows compatibility failed' }
            python windows/tests/benchmark.py (Join-Path $bin 'nekokem.exe') | Tee-Object -FilePath (Join-Path $bin 'benchmark.json')
            if ($LASTEXITCODE -ne 0) { throw 'Native throughput measurement failed' }
            python scripts/benchmark_throughput.py `
              --baseline (Join-Path $env:RUNNER_TEMP 'windows-cli-performance-baseline/nekokem.exe') `
              --candidate (Join-Path $bin 'nekokem.exe') `
              --work-dir $work `
              --json (Join-Path $env:RUNNER_TEMP 'windows-throughput-comparison.json')
            if ($LASTEXITCODE -ne 0) { throw 'Native before-and-after throughput measurement failed' }
            $return = Join-Path $env:RUNNER_TEMP 'windows-fixtures'
            New-Item -ItemType Directory -Path $return | Out-Null
            foreach ($name in @('binary','empty','linux-private.enc','windows-legacy.key','windows-legacy-fingerprint.txt','binary.windows.nkem','empty.windows.nkem')) {
              Copy-Item (Join-Path $interop $name) $return
            }
          } finally { Remove-Item $work -Recurse -Force }
      - name: Preserve Windows before-and-after throughput measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-throughput-comparison
          path: ${{ runner.temp }}/windows-throughput-comparison.json
          retention-days: 14
          if-no-files-found: warn
      - name: Verify build-only release mode preserves the Windows binary
        shell: msys2 {0}
        env:
          NEKOKEM_BUILD_TESTS: "0"
        run: |
          set -Eeuo pipefail
          temporary_root="$(cygpath -u "$RUNNER_TEMP")"
          export NEKOKEM_OPENSSL_PREFIX="$temporary_root/windows-openssl"
          output="$temporary_root/windows-cli-build-only"
          bash windows/scripts/build-windows-cli.sh "$output"
          python - "$output/nekokem.exe" "$temporary_root/windows-cli/nekokem.exe" <<'PY'
          import filecmp
          import sys
          if not filecmp.cmp(sys.argv[1], sys.argv[2], shallow=False):
              raise SystemExit('Build-only and test modes produced different Windows binaries')
          print('Build-only and test modes produced byte-identical Windows binaries')
          PY
          if compgen -G "$output/*_tests.exe" >/dev/null; then
            echo 'Build-only output unexpectedly contains test executables' >&2
            exit 1
          fi
      - name: Package unsigned native CLI
        shell: pwsh
        run: |
          $bin = Join-Path $env:RUNNER_TEMP 'windows-cli'
          # Publish compares this with the release tag.
          $recorded = (Get-Content "$bin/build-metadata.json" -Raw | ConvertFrom-Json).version
          $expected = (Select-String -Path desktop/bridge/Cargo.toml -Pattern '^version = "(.+)"$' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($recorded -ne $expected) { throw "Windows CLI metadata records version '$recorded', not $expected" }
          Compress-Archive -Path "$bin/nekokem.exe","$bin/README.md","$bin/SECURITY-DESIGN.md","$bin/LICENSE","$bin/OPENSSL-LICENSE.txt","$bin/SHA256SUMS.txt","$bin/pe-headers.txt","$bin/benchmark.json","$bin/build-metadata.json" -DestinationPath "$env:RUNNER_TEMP/NekoKEM-windows-x86_64.zip"
          (Get-FileHash "$env:RUNNER_TEMP/NekoKEM-windows-x86_64.zip" -Algorithm SHA256).Hash.ToLower() + '  NekoKEM-windows-x86_64.zip' | Set-Content "$env:RUNNER_TEMP/windows-SHA256SUMS.txt" -Encoding ascii
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NekoKEM-windows-x86_64
          path: |
            ${{ runner.temp }}/NekoKEM-windows-x86_64.zip
            ${{ runner.temp }}/windows-SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-windows-interop-fixtures
          path: ${{ runner.temp }}/windows-fixtures/
          retention-days: 14
          if-no-files-found: error

  verify-return-linux:
    name: Windows and macOS to historical Linux interoperability
    needs: [windows-native, macos-cli]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pre-port-linux-cli
          path: ${{ runner.temp }}/baseline-bin
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: public-windows-interop-fixtures
          path: ${{ runner.temp }}/windows-fixtures
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: public-macos-interop-fixtures
          path: ${{ runner.temp }}/macos-fixtures
      - name: Execute Windows-to-pre-port-Linux compatibility tests
        run: |
          chmod 755 "$RUNNER_TEMP/baseline-bin/baseline-nekokem"
          python3 windows/tests/interop.py verify "$RUNNER_TEMP/baseline-bin/baseline-nekokem" "$RUNNER_TEMP/windows-fixtures"
          python3 macos/tests/interop.py verify "$RUNNER_TEMP/baseline-bin/baseline-nekokem" "$RUNNER_TEMP/macos-fixtures"

  macos-cli:
    name: Apple Silicon CLI security and interoperability tests
    needs: baseline-linux
    runs-on: macos-15
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.16'
      - name: Identify native Apple compiler and SDK
        id: compiler
        run: |
          set -Eeuo pipefail
          test "$(uname -m)" = arm64
          identity=$({ xcrun clang --version; xcrun --sdk macosx --show-sdk-version; } | shasum -a 256 | cut -d ' ' -f 1)
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "NEKOKEM_OPENSSL_PREFIX=$RUNNER_TEMP/macos-openssl" >> "$GITHUB_ENV"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/macos-openssl
          key: macos-arm64-openssl-4.1.0-${{ steps.compiler.outputs.identity }}-${{ hashFiles('macos/scripts/build-openssl.sh') }}
      - name: Build and test native arm64 CLI with ASan and UBSan
        run: bash macos/scripts/build-macos-cli.sh "$RUNNER_TEMP/macos-cli"
      - name: Verify build-only mode preserves the release binary and package
        env:
          NEKOKEM_BUILD_TESTS: '0'
        run: |
          set -Eeuo pipefail
          bash macos/scripts/build-macos-cli.sh "$RUNNER_TEMP/macos-cli-build-only"
          cmp "$RUNNER_TEMP/macos-cli/nekokem" "$RUNNER_TEMP/macos-cli-build-only/nekokem"
          cmp "$RUNNER_TEMP/macos-cli/NekoKEM-macos-arm64.tar.gz" "$RUNNER_TEMP/macos-cli-build-only/NekoKEM-macos-arm64.tar.gz"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: public-linux-interop-fixtures
          path: ${{ runner.temp }}/macos-fixtures
      - name: Compare all current CLI options and exchange historical Linux containers
        run: python3 macos/tests/interop.py macos "$RUNNER_TEMP/macos-cli/nekokem" "$RUNNER_TEMP/macos-fixtures"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NekoKEM-macos-arm64
          path: |
            ${{ runner.temp }}/macos-cli/NekoKEM-macos-arm64.tar.gz
            ${{ runner.temp }}/macos-cli/macos-SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-macos-interop-fixtures
          path: |
            ${{ runner.temp }}/macos-fixtures/binary
            ${{ runner.temp }}/macos-fixtures/empty
            ${{ runner.temp }}/macos-fixtures/linux-private.enc
            ${{ runner.temp }}/macos-fixtures/macos-legacy.key
            ${{ runner.temp }}/macos-fixtures/macos-legacy-fingerprint.txt
            ${{ runner.temp }}/macos-fixtures/*.macos.nkem
          retention-days: 14
          if-no-files-found: error

  macos-swiftui:
    name: Apple Silicon SwiftUI app build, bridge tests and screenshots
    # macOS 26 and its SDK: the app adopts Liquid Glass there.
    runs-on: macos-26
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.16'
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.99.0
          targets: aarch64-apple-darwin
      - name: Identify native Apple compiler and SDK
        id: compiler
        run: |
          set -Eeuo pipefail
          test "$(uname -m)" = arm64
          identity=$({ xcrun clang --version; xcrun --sdk macosx --show-sdk-version; } | shasum -a 256 | cut -d ' ' -f 1)
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "NEKOKEM_OPENSSL_PREFIX=$RUNNER_TEMP/macos-openssl" >> "$GITHUB_ENV"
          xcrun swift --version
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/macos-openssl
          key: macos26-arm64-openssl-4.1.0-${{ steps.compiler.outputs.identity }}-${{ hashFiles('macos/scripts/build-openssl.sh') }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: desktop/bridge
          cache-on-failure: true
      - name: Build the pinned native static dependency
        run: bash macos/scripts/build-openssl.sh "$NEKOKEM_OPENSSL_PREFIX"
      - name: Run the bridge tests against the C17 Core
        working-directory: desktop/bridge
        run: cargo test --locked --release --target aarch64-apple-darwin -- --test-threads=1
      - name: Build the ad-hoc signed SwiftUI application
        run: bash macos/gui/scripts/build-app.sh "$RUNNER_TEMP/macos-swiftui"
      - name: Verify the app starts and reads its settings through the bridge
        run: |
          set -Eeuo pipefail
          log="$RUNNER_TEMP/macos-swiftui/startup.log"
          NEKOKEM_NATIVE_STARTUP_EVIDENCE=1 "$RUNNER_TEMP/macos-swiftui/NekoKEM.app/Contents/MacOS/NekoKEM" > "$log" 2>&1 &
          pid=$!
          for attempt in $(seq 1 150); do
            if grep -Fq 'NekoKEM native startup: settings-ready' "$log"; then break; fi
            kill -0 "$pid" || { cat "$log"; exit 1; }
            sleep 0.2
          done
          cat "$log"
          grep -Fq 'NekoKEM native startup: settings-ready' "$log"
          kill -TERM "$pid"
          wait "$pid" || true
      - name: Capture every page of the app
        run: |
          set -Eeuo pipefail
          screens="$RUNNER_TEMP/macos-swiftui/screens"
          "$RUNNER_TEMP/macos-swiftui/NekoKEM.app/Contents/MacOS/NekoKEM" --screenshots "$screens" &
          pid=$!
          for attempt in $(seq 1 120); do
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          if kill -0 "$pid" 2>/dev/null; then kill -KILL "$pid"; echo 'The screenshot run did not finish' >&2; exit 1; fi
          for name in files-empty files encrypt-recipients encrypt-warning files-password files-done keys fingerprint contacts contacts-selected settings; do
            test -s "$screens/$name.png"
          done
      - name: Check the application and write its ZIP and disk image
        run: |
          # The same command the Release workflow runs.
          python3 desktop/scripts/package-desktop.py macos --app "$RUNNER_TEMP/macos-swiftui/NekoKEM.app" \
            --output "$RUNNER_TEMP/macos-gui" --source-sha "$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: macos-swiftui-app
          path: |
            ${{ runner.temp }}/macos-swiftui/screens
            ${{ runner.temp }}/macos-swiftui/startup.log
            ${{ runner.temp }}/macos-gui
          retention-days: 14

  compose-linux:
    name: Linux ${{ matrix.arch }} Compose desktop build, screenshots and packages
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            resources: linux-x64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            resources: linux-arm64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.16'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.99.0
          targets: ${{ matrix.arch }}-unknown-linux-gnu
      - name: Install native build, packaging and desktop test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential ca-certificates curl perl binutils fakeroot rpm \
            xvfb xauth xdotool libgl1 libegl1 libxrender1 libxtst6 libxi6
      - name: Identify native compiler and libc
        id: compiler
        run: |
          set -Eeuo pipefail
          test "$(uname -m)" = '${{ matrix.arch }}'
          identity=$({ gcc --version; getconf GNU_LIBC_VERSION; } | sha256sum | cut -d ' ' -f 1)
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "NEKOKEM_OPENSSL_PREFIX=$RUNNER_TEMP/linux-gui-openssl" >> "$GITHUB_ENV"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/linux-gui-openssl
          key: linux-gui-${{ matrix.arch }}-openssl-4.1.0-${{ steps.compiler.outputs.identity }}-${{ hashFiles('desktop/scripts/build-linux-openssl.sh') }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: desktop/bridge
          cache-on-failure: true
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Build and verify the pinned static PIC dependency
        run: bash desktop/scripts/build-linux-openssl.sh '${{ matrix.arch }}' "$NEKOKEM_OPENSSL_PREFIX"
      - name: Test and build the bridge library against the C17 Core
        working-directory: desktop/bridge
        run: |
          set -Eeuo pipefail
          cargo test --locked --release --target '${{ matrix.arch }}-unknown-linux-gnu' -- --test-threads=1
          cargo build --locked --release --target '${{ matrix.arch }}-unknown-linux-gnu'
          # The app carries the library and the licences of what is linked into it.
          python3 "$GITHUB_WORKSPACE/desktop/scripts/package-desktop.py" resources \
            --library "target/${{ matrix.arch }}-unknown-linux-gnu/release/libnekokem_native.so" \
            --openssl-license "$NEKOKEM_OPENSSL_PREFIX/LICENSE.txt" \
            --target "$GITHUB_WORKSPACE/desktop-compose/native/${{ matrix.resources }}"
      - name: Render every page of both styles with the real bridge
        working-directory: desktop-compose
        run: |
          set -Eeuo pipefail
          # Named for this run only; the packaged launcher finds the library in its own resources.
          ./gradlew --no-daemon screenshots "-Pnekokem.bridge=$PWD/native/${{ matrix.resources }}/libnekokem_native.so"
          test "$(find build/screenshots -name '*.png' -size +0 | wc -l)" -ge 40
      - name: Build, check and name the Debian, RPM and folder packages
        working-directory: desktop-compose
        run: |
          set -Eeuo pipefail
          ./gradlew --no-daemon createDistributable packageDeb packageRpm
          # The same command the Release workflow runs: hardening, licences, versions and font dependencies.
          python3 ../desktop/scripts/package-desktop.py linux --arch '${{ matrix.arch }}' \
            --app build/compose/binaries/main/app/NekoKEM \
            --deb build/compose/binaries/main/deb/*.deb --rpm build/compose/binaries/main/rpm/*.rpm \
            --output "$RUNNER_TEMP/linux-gui" --source-sha "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/compose-linux"
          cp -r build/screenshots "$RUNNER_TEMP/compose-linux/screens"
      - name: Install the package and verify the installed window opens
        run: |
          set -Eeuo pipefail
          # The package registers its menu entry; a runner image has no desktop menu directories.
          sudo mkdir -p /usr/share/applications /usr/share/desktop-directories
          sudo apt-get install --yes "$RUNNER_TEMP/linux-gui/NekoKEM-linux-${{ matrix.arch }}-GUI.deb"
          test -s /opt/nekokem/lib/app/resources/libnekokem_native.so
          # Installed as a dependency, for Chinese, Japanese and Korean text.
          dpkg -s fonts-noto-cjk > /dev/null
          export XDG_CONFIG_HOME="$RUNNER_TEMP/compose-linux/config"
          mkdir -p "$XDG_CONFIG_HOME"
          xvfb-run -a -s '-screen 0 1280x1024x24' bash -c '
            /opt/nekokem/bin/NekoKEM > "$RUNNER_TEMP/compose-linux/startup.log" 2>&1 &
            pid=$!
            for attempt in $(seq 1 60); do
              if xdotool search --name "^NekoKEM$" > /dev/null 2>&1; then break; fi
              kill -0 "$pid" || { cat "$RUNNER_TEMP/compose-linux/startup.log"; exit 1; }
              sleep 1
            done
            xdotool search --name "^NekoKEM$" > /dev/null
            sleep 3
            kill -0 "$pid"
            kill -TERM "$pid"
            wait "$pid" || true
          '
          cat "$RUNNER_TEMP/compose-linux/startup.log"
      - name: Install the RPM on Fedora 44 with its dependencies
        run: |
          set -Eeuo pipefail
          # dnf resolves the package's requirements, the CJK fonts among them, from Fedora's repositories.
          docker run --rm --volume "$RUNNER_TEMP/linux-gui:/packages:ro" fedora:44 bash -c '
            set -Eeuo pipefail
            dnf install --assumeyes "/packages/NekoKEM-linux-${{ matrix.arch }}-GUI.rpm"
            test -x /opt/nekokem/bin/NekoKEM
            test -s /opt/nekokem/lib/app/resources/libnekokem_native.so
            rpm -qa | grep -i "noto-sans-cjk"
          '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: compose-linux-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/compose-linux
            ${{ runner.temp }}/linux-gui
          retention-days: 14

  compose-windows:
    name: Windows Compose desktop build, screenshots and installer
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.16'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.99.0-x86_64-pc-windows-gnu
          targets: x86_64-pc-windows-gnu
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          # MSYS2 requires a coherent rolling package set; see release/README.md.
          update: true
          install: >-
            make perl curl tar
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python
      - name: Identify native compiler
        id: compiler
        shell: msys2 {0}
        run: |
          echo "version=$(gcc -dumpfullversion)" >> "$GITHUB_OUTPUT"
          echo "gcc=$(cygpath -m "$(command -v gcc)")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/windows-openssl
          key: windows-ucrt64-openssl-4.1.0-${{ steps.compiler.outputs.version }}-${{ hashFiles('windows/scripts/build-windows-cli.sh') }}
          restore-keys: windows-ucrt64-openssl-4.1.0-${{ steps.compiler.outputs.version }}-
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: desktop/bridge
          cache-on-failure: true
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Build the pinned OpenSSL with the original CLI
        shell: msys2 {0}
        run: |
          export NEKOKEM_OPENSSL_PREFIX="$(cygpath -u "$RUNNER_TEMP")/windows-openssl"
          bash windows/scripts/build-windows-cli.sh "$(cygpath -u "$RUNNER_TEMP")/windows-cli"
      - name: Configure the matching Rust/C ABI
        shell: pwsh
        run: |
          $compiler = '${{ steps.compiler.outputs.gcc }}'
          if (!(Test-Path -LiteralPath $compiler)) { throw "GCC not found: $compiler" }
          $bin = Split-Path $compiler
          "NEKOKEM_NATIVE_BIN=$bin" >> $env:GITHUB_ENV
          "CC_x86_64_pc_windows_gnu=$compiler" >> $env:GITHUB_ENV
          "CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=$compiler" >> $env:GITHUB_ENV
          "NEKOKEM_OPENSSL_PREFIX=$env:RUNNER_TEMP\windows-openssl" >> $env:GITHUB_ENV
      - name: Test and build the bridge library against the C17 Core
        shell: pwsh
        working-directory: desktop/bridge
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PATH = "$env:NEKOKEM_NATIVE_BIN;$env:PATH"
          cargo test --locked --release --target x86_64-pc-windows-gnu -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Bridge tests failed' }
          cargo build --locked --release --target x86_64-pc-windows-gnu
          if ($LASTEXITCODE -ne 0) { throw 'Bridge build failed' }
          $library = 'target\x86_64-pc-windows-gnu\release\nekokem_native.dll'
          # One self-contained DLL: no MinGW runtime or OpenSSL DLL beside it.
          $imports = & "$env:NEKOKEM_NATIVE_BIN\objdump.exe" -p $library | Select-String 'DLL Name'
          $imports
          if ($imports -match 'libgcc|libwinpthread|libcrypto|libssl|libstdc') { throw 'The bridge needs a runtime DLL' }
          # The app carries the library and the licences of what is linked into it.
          python "$env:GITHUB_WORKSPACE\desktop\scripts\package-desktop.py" resources --library $library `
            --openssl-license "$env:RUNNER_TEMP\windows-cli\OPENSSL-LICENSE.txt" `
            --target "$env:GITHUB_WORKSPACE\desktop-compose\native\windows-x64"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot prepare the application resources' }
      - name: Render every page of both styles with the real bridge
        shell: pwsh
        working-directory: desktop-compose
        run: |
          $ErrorActionPreference = 'Stop'
          # Named for this run only; the packaged launcher finds the library in its own resources.
          .\gradlew.bat --no-daemon screenshots "-Pnekokem.bridge=$PWD\native\windows-x64\nekokem_native.dll"
          if ($LASTEXITCODE -ne 0) { throw 'Screenshots failed' }
          $count = (Get-ChildItem build\screenshots -Filter *.png | Where-Object Length -gt 0).Count
          if ($count -lt 40) { throw "Only $count screenshots" }
      - name: Build the application folder and the MSI installer
        shell: pwsh
        working-directory: desktop-compose
        run: |
          $ErrorActionPreference = 'Stop'
          .\gradlew.bat --no-daemon createDistributable packageMsi
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed' }
          # The same command the Release workflow runs: licences, the bridge and build records.
          $msi = (Get-ChildItem build\compose\binaries\main\msi\*.msi | Select-Object -First 1).FullName
          python ..\desktop\scripts\package-desktop.py windows --app build\compose\binaries\main\app\NekoKEM `
            --msi $msi --output (Join-Path $env:RUNNER_TEMP 'windows-gui') --source-sha $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Package checks failed' }
          $out = Join-Path $env:RUNNER_TEMP 'compose-windows'
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item -Recurse build\screenshots (Join-Path $out 'screens')
      - name: Verify the packaged application starts with its own bridge
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = 'desktop-compose\build\compose\binaries\main\app\NekoKEM'
          if (!(Test-Path "$app\app\resources\nekokem_native.dll")) { throw 'The bridge is not in the package' }
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'compose-windows-config'
          New-Item -ItemType Directory -Force $env:LOCALAPPDATA | Out-Null
          $out = Join-Path $env:RUNNER_TEMP 'compose-windows'
          $process = Start-Process -FilePath "$app\NekoKEM.exe" -PassThru `
            -RedirectStandardOutput "$out\startup-out.log" -RedirectStandardError "$out\startup-err.log"
          $shown = $false
          foreach ($attempt in 1..60) {
            Start-Sleep -Seconds 1
            $process.Refresh()
            if ($process.HasExited) {
              Get-Content "$out\startup-out.log", "$out\startup-err.log"
              # The launcher has no console; the same start through java.exe shows the reason.
              $cfg = Get-Content "$app\app\NekoKEM.cfg"
              $cfg
              $base = (Resolve-Path "$app\app").Path
              $classpath = ($cfg | Where-Object { $_ -like 'app.classpath=*' } | ForEach-Object { $_.Substring(14).Replace('$APPDIR', $base) }) -join ';'
              $options = @($cfg | Where-Object { $_ -like 'java-options=*' } | ForEach-Object { $_.Substring(13).Replace('$APPDIR', $base) })
              $main = ($cfg | Where-Object { $_ -like 'app.mainclass=*' }).Substring(14)
              $java = "$app\runtime\bin\java.exe"
              if (!(Test-Path $java)) { $java = "$env:JAVA_HOME\bin\java.exe" }
              $arguments = $options + @('-cp', $classpath, $main)
              $direct = Start-Process -FilePath $java -ArgumentList $arguments -PassThru -NoNewWindow `
                -RedirectStandardOutput "$out\direct-out.log" -RedirectStandardError "$out\direct-err.log"
              if (!$direct.WaitForExit(30000)) { Stop-Process -Id $direct.Id }
              Get-Content "$out\direct-out.log", "$out\direct-err.log"
              throw "The application exited with $($process.ExitCode)"
            }
            # The launcher may hand over to a child process, which then owns the window.
            if (Get-Process -Name NekoKEM -ErrorAction SilentlyContinue | Where-Object MainWindowTitle -eq 'NekoKEM') { $shown = $true; break }
          }
          if (!$shown) {
            Get-Process | Where-Object { $_.MainWindowTitle } | Format-Table Name, Id, MainWindowTitle
            Get-Content "$out\startup-out.log", "$out\startup-err.log"
            throw 'The window did not open'
          }
          Get-Process -Name NekoKEM -ErrorAction SilentlyContinue | Stop-Process
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: compose-windows-x86_64
          path: |
            ${{ runner.temp }}/compose-windows
            ${{ runner.temp }}/windows-gui
          retention-days: 14
