name: Continuous integration

on:
  pull_request:
    branches:
      - main
      - fix/audit-core-input-boundaries
      - fix/android-temporary-nkpr-suffix
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-tests:
    name: Linux Core and CLI tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Check out performance baseline
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
          path: performance-baseline-source

      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            afl++ build-essential ca-certificates curl perl

      - name: Build OpenSSL 4.0.3
        env:
          OPENSSL_VERSION: "4.0.3"
          OPENSSL_SHA256: 325b5c806167c13b40b1ffeadfe0248197c00eccc4cf123ec1e28d2d2fd216d9
        run: |
          set -Eeuo pipefail
          build_root="$RUNNER_TEMP/openssl-build"
          install_root="$RUNNER_TEMP/openssl-$OPENSSL_VERSION"
          archive="$build_root/openssl-$OPENSSL_VERSION.tar.gz"
          source_dir="$build_root/source"

          mkdir -p "$build_root" "$source_dir"
          curl --fail --location --silent --show-error --proto '=https' \
            --tlsv1.2 --retry 3 \
            --output "$archive" \
            "https://github.com/openssl/openssl/releases/download/openssl-$OPENSSL_VERSION/openssl-$OPENSSL_VERSION.tar.gz"
          printf '%s  %s\n' "$OPENSSL_SHA256" "$archive" | sha256sum -c -
          tar --extract --gzip --file "$archive" \
            --directory "$source_dir" --strip-components=1 --no-same-owner

          cd "$source_dir"
          perl ./Configure linux-x86_64 \
            no-shared no-module no-dso no-tests no-apps no-docs \
            no-sock no-zlib no-zstd \
            --prefix="$install_root" --openssldir=/etc/ssl --libdir=lib
          make --silent -j2
          make --silent install_dev

      - name: Run complete Linux test suite
        env:
          CPATH: ${{ runner.temp }}/openssl-4.0.3/include
          LIBRARY_PATH: ${{ runner.temp }}/openssl-4.0.3/lib
        run: make -C linux test

      - name: Compare Linux throughput against the PR base
        env:
          CPATH: ${{ runner.temp }}/openssl-4.0.3/include
          LIBRARY_PATH: ${{ runner.temp }}/openssl-4.0.3/lib
        run: |
          set -Eeuo pipefail
          # Both builds use the same runner, pinned OpenSSL and hardened flags.
          make -C performance-baseline-source/linux all
          python3 scripts/benchmark_throughput.py \
            --baseline performance-baseline-source/linux/nekokem \
            --candidate linux/nekokem \
            --json "$RUNNER_TEMP/linux-throughput-comparison.json"

      - name: Preserve Linux before-and-after throughput measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-throughput-comparison
          path: ${{ runner.temp }}/linux-throughput-comparison.json
          if-no-files-found: warn
          retention-days: 14

      - name: Test fuzz result and process failure handling
        run: python3 .github/scripts/test_fuzz_smoke.py -v

      - name: Test emulator image installation failure handling
        run: python3 .github/scripts/test_android_emulator_image.py

      - name: Test release signing configuration and identity persistence
        run: python3 .github/scripts/test_release_signing.py -v

      - name: Run parser fuzz smoke tests
        env:
          AFL_I_DONT_CARE_ABOUT_MISSING_CRASHES: "1"
          AFL_NO_UI: "1"
          AFL_SKIP_CPUFREQ: "1"
          CPATH: ${{ runner.temp }}/openssl-4.0.3/include
          LIBRARY_PATH: ${{ runner.temp }}/openssl-4.0.3/lib
        run: |
          set -Eeuo pipefail
          make -C linux fuzz-build \
            FUZZ_LDFLAGS="-fsanitize=undefined -L$LIBRARY_PATH"
          status=0
          for format in nkem nkpr; do
            if ! python3 .github/scripts/run_fuzz_smoke.py \
              --seeds "core/fuzz/seeds/$format" \
              --target "core/fuzz/bin/fuzz_$format" \
              --output "$RUNNER_TEMP/fuzz-$format"; then
              status=1
            fi
          done
          exit "$status"

      - name: Archive fuzz results with original AFL filenames
        if: always()
        run: python3 .github/scripts/archive_fuzz_results.py "$RUNNER_TEMP"

      - name: Preserve fuzz logs, statistics and samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parser-fuzz-results
          path: ${{ runner.temp }}/parser-fuzz-results.tar.gz
          if-no-files-found: warn
          retention-days: 14

  android-build:
    name: Android debug build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install pinned Android toolchain
        run: |
          set -Eeuo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager_path=$(find "$sdk_root/cmdline-tools" -maxdepth 3 \
            -type f -name sdkmanager -print -quit)
          if [ -z "$sdkmanager_path" ]; then
            echo "sdkmanager not found under $sdk_root/cmdline-tools" >&2
            exit 1
          fi
          "$sdkmanager_path" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"
          printf 'ANDROID_SDK_ROOT=%s\n' "$sdk_root" >> "$GITHUB_ENV"
          printf 'ANDROID_NDK_ROOT=%s/ndk/28.2.13676358\n' \
            "$sdk_root" >> "$GITHUB_ENV"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build OpenSSL 4.0.3 for Android arm64
        working-directory: android
        env:
          JOBS: "2"
        run: sh scripts/build-openssl-android.sh

      - name: Run Android unit tests and build debug artifacts
        working-directory: android
        run: |
          bash ./gradlew --no-daemon --stacktrace \
            testDebugUnitTest \
            assembleDebug \
            assembleDebugAndroidTest

      - name: Preserve executed JVM test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-jvm-test-results
          path: |
            android/app/build/test-results/testDebugUnitTest/
            android/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

  android-instrumentation:
    name: Android device tests (API ${{ matrix.api }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install pinned native toolchain
        run: |
          set -Eeuo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager_path=$(find "$sdk_root/cmdline-tools" -maxdepth 3 \
            -type f -name sdkmanager -print -quit)
          if [ -z "$sdkmanager_path" ]; then
            echo "sdkmanager not found under $sdk_root/cmdline-tools" >&2
            exit 1
          fi
          "$sdkmanager_path" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"
          printf 'ANDROID_SDK_ROOT=%s\n' "$sdk_root" >> "$GITHUB_ENV"
          printf 'ANDROID_NDK_ROOT=%s/ndk/28.2.13676358\n' \
            "$sdk_root" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Build pinned OpenSSL for the test emulator
        working-directory: android
        env:
          JOBS: "2"
        run: sh scripts/build-openssl-android.sh x86_64
      - name: Build emulator app and device tests
        working-directory: android
        run: |
          bash ./gradlew --no-daemon -PnekokemEmulatorTest=true tasks --all \
            > "$RUNNER_TEMP/nekokem-emulator-tasks.txt"
          if grep -Eq '^([[:alnum:]_.-]+:)*(assembleRelease|bundleRelease)([[:space:]]|$)' \
              "$RUNNER_TEMP/nekokem-emulator-tasks.txt"; then
            echo "Emulator test configuration must not expose release variants" >&2
            exit 1
          fi
          bash ./gradlew --no-daemon --stacktrace -PnekokemEmulatorTest=true assembleDebug assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and verify emulator image with bounded download retries
        run: bash .github/scripts/install_android_emulator_image.sh "$ANDROID_SDK_ROOT" "${{ matrix.api }}"
      - name: Execute JNI, SAF and language tests on a device
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            adb shell svc power stayon true
            adb shell settings put system screen_off_timeout 1800000
            # API 35 Pixel Launcher ANRs can cover the app with a system dialog.
            # Disable only this unrelated launcher in the disposable test device.
            # App ANRs and all JNI/SAF/language assertions remain enabled.
            if [ '${{ matrix.api }}' = 35 ]; then adb shell pm disable-user --user 0 com.google.android.apps.nexuslauncher; fi
            adb shell settings put system font_scale 1.5
            adb shell cmd uimode night yes
            bash .github/scripts/run_android_device_tests.sh android/device-reports
      - name: Preserve actual device test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-device-api-${{ matrix.api }}
          path: android/device-reports/
          if-no-files-found: warn
          retention-days: 14
