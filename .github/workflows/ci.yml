          if-no-files-found: error

  linux-gui:
    name: Linux ${{ matrix.arch }} GUI build and native tests
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
          targets: ${{ matrix.arch }}-unknown-linux-gnu
      - name: Install native GTK/WebKit and desktop test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential ca-certificates curl perl pkg-config binutils \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf rpm xvfb xauth xdotool openbox dbus-x11
      - name: Identify native compiler and libc
        id: compiler
        run: |
          set -Eeuo pipefail
          test "$(uname -m)" = '${{ matrix.arch }}'
          identity=$({ gcc --version; getconf GNU_LIBC_VERSION; } | sha256sum | cut -d ' ' -f 1)
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "NEKOKEM_OPENSSL_PREFIX=$RUNNER_TEMP/linux-gui-openssl" >> "$GITHUB_ENV"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/linux-gui-openssl
          key: linux-gui-${{ matrix.arch }}-openssl-4.0.3-${{ steps.compiler.outputs.identity }}-${{ hashFiles('desktop/scripts/build-linux-openssl.sh') }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: desktop/src-tauri
          cache-on-failure: true
      - name: Build and verify the pinned static PIC dependency
        run: bash desktop/scripts/build-linux-openssl.sh '${{ matrix.arch }}' "$NEKOKEM_OPENSSL_PREFIX"
      - name: Install and build the locked shared frontend
        working-directory: desktop
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Run actual Rust to C17 Core integration and private staging tests
        working-directory: desktop/src-tauri
        run: TAURI_CONFIG="$(cat tauri.linux.conf.json)" cargo test --locked --target '${{ matrix.arch }}-unknown-linux-gnu' --bin nekokem-gui -- --test-threads=1
      - name: Build the native Linux desktop package
        working-directory: desktop
        run: bash scripts/build-linux-gui.sh '${{ matrix.arch }}'
      - name: Verify ELF hardening and package the exact installed application
        run: |
          python3 desktop/scripts/package-linux-gui.py \
            --bundle-dir 'desktop/src-tauri/target/${{ matrix.arch }}-unknown-linux-gnu/release/bundle' \
            --output "$RUNNER_TEMP/linux-gui" --arch '${{ matrix.arch }}' \
            --openssl-prefix "$NEKOKEM_OPENSSL_PREFIX" --source-sha "$GITHUB_SHA"
      - name: Install the verified native Debian package
        run: sudo apt-get install --yes "$RUNNER_TEMP/linux-gui/NekoKEM-linux-${{ matrix.arch }}-GUI.deb"
      - name: Verify the actual installed sandboxed WebKit window and normal close
        run: |
          dbus-run-session -- xvfb-run -a -s '-screen 0 1280x1024x24' \
            python3 desktop/tests/launch_linux.py \
            /usr/bin/nekokem-gui \
            --log "$RUNNER_TEMP/linux-gui/startup.log"
      - name: Install and launch the native RPM on Fedora 44
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/linux-gui/rpm-evidence"
          docker run --rm \
            --mount "type=bind,src=$GITHUB_WORKSPACE/desktop/tests,dst=/nekokem-tests,readonly" \
