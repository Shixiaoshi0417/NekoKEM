name: Verify persisted Android signing secrets

on:
  push:
    branches: [verify/android-signing-secrets-20261001]

permissions:
  contents: read

jobs:
  verify-signing:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Load configured signing identity
        env:
          ROTATE_SIGNING: "false"
          NEKOKEM_RELEASE_KEYSTORE_BASE64: ${{ secrets.NEKOKEM_RELEASE_KEYSTORE_BASE64 }}
          NEKOKEM_RELEASE_STORE_PASSWORD: ${{ secrets.NEKOKEM_RELEASE_STORE_PASSWORD }}
          NEKOKEM_RELEASE_KEY_ALIAS: ${{ secrets.NEKOKEM_RELEASE_KEY_ALIAS }}
          NEKOKEM_RELEASE_KEY_PASSWORD: ${{ secrets.NEKOKEM_RELEASE_KEY_PASSWORD }}
        run: python3 .github/scripts/prepare_release_signing.py
      - name: Verify released certificate and private-key signing
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import subprocess
          root = Path(os.environ['RUNNER_TEMP']) / 'nekokem-release-signing'
          store = os.environ['NEKOKEM_RELEASE_STORE_FILE']
          alias = os.environ['NEKOKEM_RELEASE_KEY_ALIAS']
          cert = subprocess.check_output([
              'keytool', '-exportcert', '-keystore', store, '-alias', alias,
              '-storepass:env', 'NEKOKEM_RELEASE_STORE_PASSWORD'])
          fingerprint = hashlib.sha256(cert).hexdigest()
          expected = '5a091b86b1cb339f081c1afa2aa71b986c07597343ce336f22d866b05c39fb50'
          if fingerprint != expected:
              raise SystemExit('Configured certificate does not match the published v3.2.0 APK')
          (root / 'signing-check.txt').write_text('NekoKEM signing configuration check only\n')
          unsigned = str(root / 'unsigned.jar')
          signed = str(root / 'signed.jar')
          subprocess.run(['jar', '--create', '--file', unsigned, '-C', str(root),
                          'signing-check.txt'], check=True)
          subprocess.run([
              'jarsigner', '-digestalg', 'SHA-256', '-sigalg', 'SHA256withRSA',
              '-keystore', store, '-storetype', 'PKCS12',
              '-storepass:env', 'NEKOKEM_RELEASE_STORE_PASSWORD',
              '-keypass:env', 'NEKOKEM_RELEASE_KEY_PASSWORD',
              '-signedjar', signed, unsigned, alias], check=True)
          subprocess.run([
              'jarsigner', '-verify', '-strict', '-keystore', store,
              '-storetype', 'PKCS12',
              '-storepass:env', 'NEKOKEM_RELEASE_STORE_PASSWORD',
              signed, alias], check=True)
          print('All four signing Secrets work; private-key signing and verification passed.')
          print('Certificate SHA-256 matches v3.2.0: ' + fingerprint)
          PY
      - name: Remove private signing material
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/nekokem-release-signing"
