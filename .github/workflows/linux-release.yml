name: Linux CLI release builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-linux:
    name: Build and test ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential ca-certificates curl perl

      - name: Build, verify, and package
        run: bash linux/scripts/build-linux-release.sh "${{ matrix.arch }}" "$GITHUB_WORKSPACE/dist"

      - name: Test latest-release installer
        run: |
          sh core/tests/install_script_tests.sh \
            "${{ matrix.arch }}" \
            "dist/NekoKEM-linux-${{ matrix.arch }}.tar.gz"

      - name: Upload Linux archive
        uses: actions/upload-artifact@v4
        with:
          name: NekoKEM-linux-${{ matrix.arch }}
          path: dist/NekoKEM-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
