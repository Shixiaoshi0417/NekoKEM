name: Publish

# Publishes one successful Release run of main as a GitHub Release. The
# notes come from release/<tag>.md at the built commit; every asset must
# pass release_assets.py and carry that run's build provenance attestation.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, such as v4.2.0 (release/<tag>.md must exist at the built commit)"
        required: true
        type: string
      ci_run:
        description: "ID of the successful CI run of the built main commit"
        required: true
        type: string
      release_run:
        description: "ID of the successful Release run of the same commit"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish ${{ inputs.tag }}
    if: github.repository == 'Shixiaoshi0417/NekoKEM' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      attestations: read
      contents: write
    env:
      REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
      CI_RUN: ${{ inputs.ci_run }}
      RELEASE_RUN: ${{ inputs.release_run }}
    steps:
      - name: Check out the publishing scripts
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install the pinned APK verification tools
        run: |
          set -Eeuo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager_path=$(find "$sdk_root/cmdline-tools" -maxdepth 3 \
            -type f -name sdkmanager -print -quit)
          if [ -z "$sdkmanager_path" ]; then
            echo "sdkmanager not found under $sdk_root/cmdline-tools" >&2
            exit 1
          fi
          "$sdkmanager_path" "build-tools;35.0.0"
          printf 'ANDROID_SDK_ROOT=%s\n' "$sdk_root" >> "$GITHUB_ENV"
      - name: Test the asset checks
        run: |
          python3 .github/scripts/test_release_assets.py -v
          python3 .github/scripts/test_publish_release.py -v
      - name: Verify the runs, assets and attestations, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/publish_release.py
