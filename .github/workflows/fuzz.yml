name: Fuzz

# Long AFL++ sessions against the same harnesses that CI fuzzes for 15
# seconds. Each target runs in its own job for FUZZ_SECONDS; any crash, hang,
# sanitizer report or incomplete run fails the job, and the samples are kept
# as an artifact for 30 days.

on:
  schedule:
    # Sundays 18:00 UTC.
    - cron: "0 18 * * 0"
  # A change to this workflow is checked with a one-minute run per target.
  pull_request:
    paths:
      - .github/workflows/fuzz.yml
  workflow_dispatch:
    inputs:
      seconds:
        description: Fuzzing time per target in seconds (60 to 18000)
        required: false
        default: "3600"

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-24.04
    # Up to five hours of fuzzing plus the OpenSSL and harness builds.
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        target: [nkem, nkpr, decrypt, identity]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Choose the fuzzing time
        env:
          EVENT: ${{ github.event_name }}
          REQUESTED: ${{ inputs.seconds }}
        run: |
          set -Eeuo pipefail
          if [[ "$EVENT" == pull_request ]]; then
            seconds=60
          else
            seconds="${REQUESTED:-3600}"
          fi
          if ! [[ "$seconds" =~ ^[0-9]+$ ]] || (( seconds < 60 || seconds > 18000 )); then
            echo "seconds must be a whole number from 60 to 18000, got '$seconds'" >&2
            exit 1
          fi
          echo "FUZZ_SECONDS=$seconds" >> "$GITHUB_ENV"

      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            afl++ build-essential ca-certificates curl perl

      # The build below depends only on the pinned source, this step's flags
      # and the runner's compiler, so a cached prefix is reused until any of
      # those changes.
      - name: Identify the native compiler for the OpenSSL cache
        id: compiler
        run: echo "identity=$(gcc --version | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Restore the pinned OpenSSL build
        id: openssl-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/openssl-4.1.0
          key: fuzz-openssl-4.1.0-${{ steps.compiler.outputs.identity }}-${{ hashFiles('.github/workflows/fuzz.yml') }}

      - name: Build OpenSSL 4.1.0
        if: steps.openssl-cache.outputs.cache-hit != 'true'
        env:
          OPENSSL_VERSION: "4.1.0"
          OPENSSL_SHA256: 50c17baf54cb008f6ce42d50deb4b28050a1aad711636cabd4b241c7e90cc2fd
        run: |
          set -Eeuo pipefail
          build_root="$RUNNER_TEMP/openssl-build"
          install_root="$RUNNER_TEMP/openssl-$OPENSSL_VERSION"
          archive="$build_root/openssl-$OPENSSL_VERSION.tar.gz"
          source_dir="$build_root/source"

          mkdir -p "$build_root" "$source_dir"
          curl --fail --location --silent --show-error --proto '=https' \
            --tlsv1.2 --retry 3 \
            --output "$archive" \
            "https://github.com/openssl/openssl/releases/download/openssl-$OPENSSL_VERSION/openssl-$OPENSSL_VERSION.tar.gz"
          printf '%s  %s\n' "$OPENSSL_SHA256" "$archive" | sha256sum -c -
          tar --extract --gzip --file "$archive" \
            --directory "$source_dir" --strip-components=1 --no-same-owner

          cd "$source_dir"
          perl ./Configure linux-x86_64 \
            no-shared no-module no-dso no-tests no-apps no-docs \
            no-sock no-zlib no-zstd \
            --prefix="$install_root" --openssldir=/etc/ssl --libdir=lib
          make --silent -j"$(nproc)"
          make --silent install_dev

      - name: Fuzz ${{ matrix.target }}
        env:
          AFL_I_DONT_CARE_ABOUT_MISSING_CRASHES: "1"
          AFL_NO_UI: "1"
          AFL_SKIP_CPUFREQ: "1"
          CPATH: ${{ runner.temp }}/openssl-4.1.0/include
          LIBRARY_PATH: ${{ runner.temp }}/openssl-4.1.0/lib
          TARGET: ${{ matrix.target }}
        run: |
          set -Eeuo pipefail
          make -C linux fuzz-build \
            FUZZ_LDFLAGS="-fsanitize=undefined -L$LIBRARY_PATH"
          python3 .github/scripts/run_fuzz_smoke.py \
            --seconds "$FUZZ_SECONDS" \
            --wall-timeout "$((FUZZ_SECONDS + 600))" \
            --seeds "core/fuzz/seeds/$TARGET" \
            --target "core/fuzz/bin/fuzz_$TARGET" \
            --output "$RUNNER_TEMP/fuzz-$TARGET"

      - name: Archive fuzz results with original AFL filenames
        if: always()
        run: python3 .github/scripts/archive_fuzz_results.py "$RUNNER_TEMP"

      - name: Preserve fuzz logs, statistics and samples
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target }}-results
          path: ${{ runner.temp }}/parser-fuzz-results.tar.gz
          if-no-files-found: warn
          retention-days: 30
