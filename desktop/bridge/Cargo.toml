[package]
name = "nekokem-native"
version = "5.0.0"
description = "NekoKEM desktop bridge: the desktop backend and the unchanged C17 Core as one DLL"
authors = ["Shixiaoshi0417"]
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
name = "nekokem_native"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
cc = "1"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1", features = ["serde"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
